# net-snmp snmptrapd.conf for the traps and informs of the snmptrap notifier
# (docs/monitoring.md). Replace the CHANGE-ME values; the passphrases are at
# least 8 characters and must match the PACKETEER_TRAP_* variables.

# v2c traps and informs: the community in community_env.
authCommunity log CHANGE-ME-community

# v3 traps. Packeteer is the authoritative engine, so the user is created for
# its engine_id (here 0x8000000001020304).
createUser -e 0x8000000001020304 trapuser SHA CHANGE-ME-auth AES CHANGE-ME-priv
authUser log trapuser priv

# v3 informs. snmptrapd is the authoritative engine, so no engine ID, and the
# notifier sets inform: true and no engine_id.
createUser informuser SHA CHANGE-ME-auth AES CHANGE-ME-priv
authUser log informuser priv
