# rsyslog receiver for the syslog notifier (docs/monitoring.md). The notifier
# sends RFC 5424 and sets the message ID to the event kind, so a rule can
# match on it. Packeteer's own structured data is kept in the file.
module(load="imudp")
module(load="imtcp")
input(type="imudp" port="514")
input(type="imtcp" port="514")

template(name="packeteer" type="string" string="%timegenerated% %HOSTNAME% %msgid% %structured-data% %msg%\n")
if $app-name == "packeteer" then {
    action(type="omfile" file="/var/log/packeteer.log" template="packeteer")
    stop
}
