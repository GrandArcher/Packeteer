# ExaBGP 4 process that applies the Packeteer external policy feed
# (docs/external-policy.md). Lab addresses only: documentation prefixes and
# private ASNs. Set PACKETEER_POLICY_TOKEN in ExaBGP's environment.
process packeteer-policy {
	run /usr/local/bin/packeteer-policy -url https://192.0.2.10:9443 -ca-file /etc/exabgp/packeteer-ca.pem -community 64512:666 -allow 198.51.100.0/24 -exabgp;
	encoder text;
}

neighbor 192.0.2.254 {
	router-id 192.0.2.30;
	local-address 192.0.2.30;
	local-as 64512;
	peer-as 64512;
	# Graceful restart off: the routes go with the session.
	capability {
		graceful-restart disable;
	}
	api {
		processes [ packeteer-policy ];
	}
}
