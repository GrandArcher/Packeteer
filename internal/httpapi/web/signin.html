<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Sign in - Packeteer</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-page="signin">
<div id="banner" class="banner" role="status" hidden></div>
<main class="signin">
  <h1>Packeteer</h1>
  <h2>Sign in</h2>
  <form id="signin-form" class="signin-form" autocomplete="on">
    <label>User name <input id="signin-name" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password <input id="signin-password" name="password" type="password" autocomplete="current-password" required></label>
    <p id="signin-error" class="bad" role="alert" hidden></p>
    <button type="submit" id="signin-submit" class="primary">Sign in</button>
  </form>
  <p id="signin-sso" hidden><a href="/auth/login">Sign in with single sign-on</a></p>
  <p class="tag">Scripts and API clients keep using basic auth or an API token.</p>
</main>
<script src="/shell.js"></script>
<script src="/signin.js"></script>
</body>
</html>
