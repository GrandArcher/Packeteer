<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Sign in - Packeteer</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/logo.png" type="image/png" sizes="128x128">
</head>
<body data-page="signin">
<a class="skip-link" href="#main">Skip to content</a>
<div id="banner" class="banner" role="status" hidden></div>
<main id="main" tabindex="-1" class="signin">
  <h1><img class="logo" src="/logo.png" width="32" height="32" alt="Packeteer logo">Packeteer</h1>
  <h2>Sign in</h2>
  <form id="signin-form" class="signin-form" autocomplete="on">
    <label>User name <input id="signin-name" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password <input id="signin-password" name="password" type="password" autocomplete="current-password" required></label>
    <p id="signin-error" class="bad" role="alert" hidden></p>
    <button type="submit" id="signin-submit" class="primary">Sign in</button>
  </form>
  <form id="change-form" class="signin-form" autocomplete="off" hidden>
    <p id="change-note">This account must choose a new password before it can do anything else.</p>
    <label>Current password <input id="change-current" name="current" type="password" autocomplete="current-password" required></label>
    <label>New password (12 or more characters) <input id="change-new" name="new" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>New password again <input id="change-again" name="again" type="password" autocomplete="new-password" minlength="12" required></label>
    <p id="change-error" class="bad" role="alert" hidden></p>
    <button type="submit" id="change-submit" class="primary">Change password</button>
  </form>
  <p id="signin-sso" hidden><a href="/auth/login">Sign in with single sign-on</a></p>
  <p class="tag">Scripts and API clients keep using basic auth or an API token.</p>
</main>
<script src="/shell.js"></script>
<script src="/signin.js"></script>
</body>
</html>
