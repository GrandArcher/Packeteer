version: "2"
run:
  timeout: 5m
# staticcheck and deadcode run as separate steps (make lint).
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
  settings:
    errcheck:
      # A write to stderr or an HTTP response has no useful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests fail on the assertion that follows; a cleanup error adds nothing.
      - linters: [errcheck]
        path: _test\.go
      # Cleanup on the way out: the caller already has its result or error.
      - linters: [errcheck]
        source: '^\s*defer .*\.(Close|close|Stop|Shutdown|Remove|RemoveAll|SetReadDeadline)\('
