# Example only. Keep mode: observe in this repository.
# Every key, default, and bound: docs/CONFIG.md
mode: observe               # also the default when mode is left out; inject is never a default

asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
max_improvements: 50        # 0 retires every improvement; 1-10000 caps them. Default 50 when omitted.
hold_time: 15m              # min life of an improvement; also cooldown after a flip-back
improvement_ttl: 1h         # re-measure the native path after this long. Falling out of a source does not retire the improvement; it stays probed until this TTL, flip-back, or a RIB leave. A path the router keeps advertising is withdrawn when it disappears; a path hidden because Packeteer's route won waits for this TTL

thresholds:
  min_loss_delta_pct: 1.0
  min_rtt_delta_ms: 15
  # min_rtt_delta_pct: 0   # 0 (default) is off. When set, an RTT win also needs this percent of the current path's RTT.
  # confirm_rounds: 1      # consecutive fresh rounds before a new performance move or switch. 1 is today. Early probes wait a quarter of the interval. Flip-back does not wait.

providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
    # exclude: true           # measure, but never steer traffic to this provider
    # group: edge             # load-balance with other providers in this group
    # precedence: 100         # lower is preferred; 0 or omitted means 100
    # cc_disable: false       # true: leave this provider out of commit control
    # cost: 5                 # price per Mbps; the cost scorer only moves between priced providers
    # local_pref: 350         # optional. Wins over local_pref_cause and the global local_pref. 0 is rejected. Set it above the edge's native local preference.
    # communities: ["64512:200", "64512:1:50"]  # optional extras, added after the cause's. The export policy does not match them. At most 16. No 0:x or 65535:x, no duplicate of packeteer_community.
    # bmp: prefer             # off (default), prefer, or only: use this provider's BMP paths (rib_sources)
    # add_path: true          # route check from iBGP add-path paths (needs a neighbor with add_path)

allowlist:
  prefixes: []

probe:
  interval: 30s               # also how often stale improvements are re-checked if a round never finishes
  timeout: 2s                 # per packet. A whole round is bounded (~3 intervals) so a stuck prober cannot pin routes
  packets: 10
  workers: 8                  # concurrent probe runs
  rate_limit_pps: 100         # global cap on probe packets per second
  per_target_concurrency: 2   # concurrent runs toward one destination host
  prober_recheck_rounds: 10   # every Nth probe of a host starts at the first prober again
  prober_memory: 100000       # hosts that remember which prober answered; oldest are dropped past this
  # retry_loss_pct: 20        # 0 (default) disables. Re-probe before storing a lossy sample.
  # retry_packets: 30         # default is 3x packets when retry_loss_pct or dispersion_ms is set
  # min_replies: 1            # replies a host needs before it defines the score. 1 is any reply.
  # dispersion_ms: 0          # 0 disables. Otherwise max RTT minus min RTT, in ms, must be at most this.
  # indirect:                 # off by default. Trace silent prefixes from each provider's source (#123)
  #   enabled: true           # and score each provider at its own highest stable hop. Measurement only.
  #   budget: 10s             # wall clock for one background pass; passes are at least interval apart
  #   cache_ttl: 30m          # reuse a hop this long, or until an address inside the prefix answers

# Probers are tried in order: ICMP echo, then TCP connect to port 443 when
# ICMP errors or gets no replies. This is also the default when omitted.
# After a host answers, later rounds start at that prober. prober_recheck_rounds
# tries the first prober again so a host that starts answering ICMP is noticed.
probers:
  - type: icmp
  - type: tcp
    config:
      port: 443
  # - type: udp               # optional fallback. A reply or ICMP port-unreachable counts.
  #   config:
  #     port: 33434

# Path scoring (lower is better): loss dominates, then latency, then jitter.
# `weighted` is the default and does not steer for commit. `commit` uses the
# same score and, with telemetry plus flow volume, keeps providers under
# their commit. Leave this as weighted unless you want that.
scorer:
  type: weighted
  config: {loss_weight: 100, rtt_weight: 1, jitter_weight: 0.5}
  # Improvement weights (#34; also on commit and cost): which new
  # improvements take the last max_improvements slots. weight =
  # performance * score gain + volume * Mbps (flow window or static mbps).
  # Omitted: biggest gain first. Never admits a prefix outside the RIB or
  # allowlist, never displaces an active improvement. docs/ui.md
  # config:
  #   improvement_weights: {performance: 1, volume: 0}
# scorer:
#   type: commit
#   config:
#     loss_override: false    # true allows a commit move onto higher loss
#     balance: off            # off, equal, or proportional
#     balance_slack: 0.10
#     max_age: 15m            # ignore telemetry older than this
#     min_mbps: 0
# `cost` uses the same score and moves prefixes to the cheapest provider
# (providers[].cost) whose path is inside the floor versus the best path.
# Needs cost on at least two providers. Rollback: switch back to weighted.
# scorer:
#   type: cost
#   config:
#     precedence: performance # performance (default) or cost
#     floor:
#       max_loss_pct: 0       # extra loss allowed over the best path
#       max_rtt: 10ms         # extra latency allowed over the best path

# What to probe. Uncomment and use prefixes you actually serve traffic to.
# The flow source is off unless you add it. With --network host its UDP
# ports are host ports; do not publish them. Docs: docs/mikrotik.md.
# sources:
#   - type: static
#     config:
#       targets:
#         - prefix: 198.51.100.0/24
#           host: 198.51.100.1        # optional; defaults to the first address
#           mbps: 0                   # optional; declared Mbps for the commit scorer
#         - prefix: 203.0.113.0/24
#   - type: flow
#     config:
#       # Up to three of the busiest destinations are probe candidates, not
#       # pins: they are probed first. Automatic addresses fill in only when
#       # fewer than three were named, then the next hop.
#       listen:
#         - "0.0.0.0:2055"            # NetFlow v5/v9 and IPFIX
#         - "0.0.0.0:6343"            # sFlow
#       window: 5m
#       top_n: 100                  # priority tier, probed every probe.interval. An active improvement stays probed after it falls off the list, until the improvement retires
#       max_targets: 100            # cap. 0 or omitted matches top_n. Up to 10000. A larger value also returns the next prefixes
#       min_bytes: 1000000          # absolute floor over the window. 0 disables this bar
#       min_pct: 0                  # percent of window bytes. 0 disables this bar. Either enabled bar keeps a prefix
#       # tail_interval: 60s        # required when max_targets is greater than top_n. Longer than probe.interval, shorter than the staleness window
#       aggregate_v4: 24
#       aggregate_v6: 48
#       exclude:
#         - 192.0.2.0/24              # destinations inside these prefixes are ignored
#       # problems:                 # optional: score TCP failures from unsampled v5/v9/IPFIX
#       #   local: [192.0.2.0/24]     # your own networks
#       #   failure_pct: 20           # SYN-without-ACK plus remote RST, % of flows
#       #   min_flows: 10
#       # transit:                  # optional: classify transit (customer-originated) vs local traffic
#       #   customers: [198.51.100.0/24]  # source networks of your customers; any other source is local
#       #   share_pct: 50             # transit share at or above which a prefix is a transit prefix
#       # subranges:                # optional: measure the busiest /24s (/48s) inside a wider prefix. Measurement only, never announced
#       #   bits_v4: 24
#       #   bits_v6: 48
#       #   max_subranges: 4          # per prefix, 2-16
#       #   max_total: 1000           # across all targets; each is probed per provider, so keep rounds inside the staleness window
#   - type: span                # passive problem detection from a mirror port. Needs NET_RAW.
#     config:                   # Does not announce; problem prefixes are probed first.
#       interface: eth1         # mirror NIC; or pcap_file: /etc/packeteer/span.pcap (lab replay)
#       local:
#         - 192.0.2.0/24        # your own networks (required)
#       window: 5m
#       retrans_pct: 5          # outbound retransmissions, % of data segments
#       failure_pct: 20         # handshake timeouts plus remote resets, % of connections
#       # rtt_ms: 0             # handshake RTT threshold; 0 disables
#       max_targets: 100
#   - type: traceroute          # last stable hop when the host does not answer.
#     config:                   # Discovery is background. Targets returns the cache.
#       interval: 5m
#       budget: 10s             # one pass; under the default round deadline
#       targets:
#         - prefix: 198.51.100.0/24
#           host: 198.51.100.1
#   - type: vip                 # own interval. ASNs match the learned path only.
#     config:                   # interval must be inside the staleness window.
#       interval: 10s
#       max_targets: 100        # cap on prefixes plus ASN matches
#       prefixes:
#         - prefix: 203.0.113.0/24
#           host: 203.0.113.1
#       asns:
#         - 64496
#   - type: outage              # re-probe when many prefixes fail together. Does not announce.
#                               # hop ASNs and other providers' paths count when they exist.
#     config:
#       min_prefixes: 3         # minimum is 2; one noisy prefix never fires
#       window: 2m
#       loss_pct: 20            # 0 uses this default
#       # rtt_ms: 200           # also treat high RTT as degraded; 0 disables
#       interval: 5s            # shorter than probe.interval and the staleness window
#       max_targets: 100
#       ignore_asns:
#         - 64512               # an ASN that sits on every learned path

# iBGP to the edge router(s). Same ASN as `asn`. The session learns best
# paths and, only in mode: inject, carries improvements back. Graceful
# restart is never enabled. Packeteer proposes a 90s hold time; the router's
# shorter timer wins. Filters: docs/mikrotik.md and docs/routers.md.
# bgp:
#   listen_port: 179            # optional; 0/omitted = connect out only
#   # listen_addresses: ["192.0.2.10"]
#   neighbors:
#     - address: 192.0.2.254
#       # port: 179             # remote port; 0/omitted = 179
#       # local_address: 192.0.2.10
#       # passive: false        # true waits for the router and needs listen_port
#       # add_path: true        # receive the router's other paths too (FRR: addpath-tx-all-paths)
#       description: edge1
#       # Several edges (#27): what each router can forward. Omit both on
#       # every neighbor to send every router every route (one edge, or a
#       # route reflector). Docs: docs/route-reflector.md.
#       # providers: [transit-a]          # this router's own transits (its egress)
#       # next_hops:
#       #   transit-b: 192.0.2.253        # reached through another router at this next hop
#   # as_path: empty            # AS path on injected routes: empty (default), native, or provider
# bgp.neighbors reloads online on SIGHUP (docker kill -s HUP); other keys need a restart.

# Internet exchanges (#27). Each peer is a provider with its own next hop on
# the peering LAN and its own probe source, and is always route-checked: it
# must advertise the exact prefix (seen through add-path or BMP). Next hops
# on the LAN that are not listed show up on /api/exchanges as discovered.
# Targets inside lans are not probed (#145), and allowlist.prefixes must
# not overlap lans. The peer next_hop is still the far-side gateway probe.
# exchanges:
#   - name: ix-example
#     lans: [203.0.113.0/24]
#     peers:
#       - name: ix-peer-a
#         asn: 64501
#         next_hop: 203.0.113.11
#         source_ip: 192.0.2.31

# Injection (used only when mode: inject). local_pref is the default on
# every injected route and should beat the edge's native local preference.
# local_pref_cause and providers[].local_pref override it (provider, then
# cause, then this value). Each set value is non-zero, same rule as this
# one. The announcer publishes that exact learned prefix and adds NO_EXPORT.
# more_specific_bits is rejected.
# local_pref: 250
# local_pref_cause:
#   performance: 300          # empty cause is performance
#   static: 400
#   commit: 220
#   cost: 210
# packeteer_community may also be a large community: "4200000000:1:666"
# communities_cause adds extras after packeteer_community. A provider's
# communities are added after the cause's. The export policy matches only
# packeteer_community. An empty cause is performance. At most 16 each.
# communities_cause:
#   performance: ["64512:100"]
#   static: ["64512:200"]
#   commit: ["64512:300"]
#   cost: ["64512:1:40"]      # large community (RFC 8092)
# announcer:
#   type: gobgp
#
# More-specific injection (off by default; docs/design/more-specific.md).
# With it, an improvement also announces the more-specifics inside its
# prefix that a neighbor advertises in the learned RIB (never a prefix
# Packeteer computed). max_routes caps routes on the router, not decisions.
# more_specific:
#   enabled: false
#   max_routes: 100

# Multi-POP (off by default; docs/multi-pop.md). One instance per POP,
# joined over mutual TLS. A provider in another domain is measured by the
# peer there; its path is that measurement plus inter_dc_rtt. It is used
# only for a prefix this POP learned, while the peer is fresh and exits the
# prefix through it. global_commit shares one commit across POPs (commit
# scorer). /api/federation is the central view. Certificates are mounted.
# domain: pop-a
# inter_dc_rtt:
#   pop-b: 12ms
# providers:            (add to the list above)
#   - name: x-b
#     domain: pop-b
#     next_hop: 192.0.2.253
# global_commit:
#   - name: carrier-x
#     commit_mbps: 1000
#     providers: [transit-a, x-b]
# federation:
#   type: mtls
#   config:
#     listen: 0.0.0.0:9443
#     cert_file: /etc/packeteer/certs/pop-a.crt
#     key_file: /etc/packeteer/certs/pop-a.key
#     ca_file: /etc/packeteer/certs/ca.crt
#     peers:
#       - name: pop-b
#         url: https://192.0.2.20:9443

# Active/standby HA (off by default; docs/ha.md). Two instances with the
# same config (own router_id, session address, and id) share a lease file
# on a volume both mount. Only the active one decides and announces; the
# standby keeps its sessions and probes but has nothing on the wire. A
# crashed active instance's routes leave with its sessions before the
# standby announces. Backup and restore: packeteer -backup / -restore.
# ha:
#   type: lease
#   config:
#     path: /var/lib/packeteer/ha/lease.json
#     id: pk-a            # or env PACKETEER_HA_ID
#     ttl: 10s
#     renew: 2s

# BMP monitoring station (RIB source). Edge routers stream their post-policy
# Adj-RIB-In (routes they accepted) here, so Packeteer sees inactive IX and backup paths without a
# full iBGP feed. Needs bgp.neighbors (the announcer uses that session).
# Providers opt in with `bmp: prefer` or `bmp: only`; those get a route
# check: no improvement onto a provider that is not advertising the exact
# prefix, and an active one is retired when it withdraws. Learn-only; never
# announces. With --network host the port is a host port: firewall it to
# the routers. Docs: docs/CONFIG.md ("RIB source bmp").
# rib_sources:
#   - type: bmp
#     config:
#       listen: ":11019"
#       routers: [192.0.2.254]
#       policy: post            # the only accepted value; pre-policy routes are refused
#       loc_rib: true
#       idle_timeout: 0         # e.g. 90s, above the router's BMP stats interval; 0 = TCP keepalive only

# Process log. level: debug, info, warn, or error.
# format: text or json. PACKETEER_LOG_LEVEL and PACKETEER_LOG_FORMAT override these.
log:
  level: info
  format: text

# Dashboard, JSON API, and Prometheus metrics. Read-only except the API
# writes (maintenance, mitigation, tools; users and tokens with auth).
# Empty listen disables the server. PACKETEER_HTTP_LISTEN overrides this
# ("off" disables). With --network host, 127.0.0.1:8080 is the host loopback.
# The image exposes port 8080. Optional basic auth (set both, or neither):
# PACKETEER_HTTP_USER and PACKETEER_HTTP_PASSWORD.
http:
  listen: "127.0.0.1:8080"
  # allow_from: [127.0.0.0/8, 192.0.2.0/24]   # client prefixes allowed (default any)
  # config_editor: true   # admin edits this file in /settings.html (#34); needs auth or basic auth and a writable mount; applies on restart

# Users, roles (viewer, operator, admin), API tokens, an audit log of every
# change (also sent to notifiers as audit.recorded), and optional OIDC SSO.
# Needs storage. The first admin comes from PACKETEER_ADMIN_PASSWORD
# (PACKETEER_ADMIN_USER, default admin). Replaces PACKETEER_HTTP_USER.
# Rollback: enabled: false. Docs: docs/auth.md. Never announces.
# auth:
#   enabled: true
#   session_ttl: 12h
#   token_ttl: 2160h
#   sso:
#     type: oidc
#     config:
#       issuer: https://idp.example.net/realms/noc
#       client_id: packeteer
#       client_secret_env: PACKETEER_OIDC_CLIENT_SECRET
#       redirect_url: https://packeteer.example.net/auth/callback
#       role_map: {noc-admins: admin, noc: operator, staff: viewer}

# Report history (improvements, before/after loss and latency, provider
# efficiency, top prefixes/ASNs/countries, probes per day, cost savings) on
# the dashboard and /api/reports. An embedded SQLite file. Mount a volume on
# /var/lib/packeteer so it survives a restart. The same file keeps SNMP
# 95th-percentile samples for the open billing period when telemetry is on.
# Delete this block to turn history off; probing and decisions do not depend
# on it, and the 95th window then stays in memory only. Does not announce.
storage:
  type: sqlite
  config:
    path: /var/lib/packeteer/packeteer.db
    retention: 9600h            # 400 days

# Troubleshooting tools on the ops server (/api/troubleshoot, dashboard).
# The looking glass (learned RIB) is always on. enabled: true adds an
# on-demand probe and traceroute from every provider source and a whois
# (RDAP) lookup, rate limited. Read-only: nothing here announces.
# troubleshoot:
#   enabled: true
#   requests_per_minute: 6
#   max_hops: 30
#   whois:
#     type: rdap
#     config:
#       base_url: https://rdap.org

# Interface counters and 95th-percentile usage. Off unless listed.
# The community and v3 passphrases are environment variables named here,
# never values in this file. Samples stay in memory. With storage above,
# the open billing period is reloaded after a restart. The collector does
# not announce.
# Docs: docs/PLUGINS.md and docs/CONFIG.md.
# telemetry:
#   - type: snmp
#     config:
#       interval: 5m
#       hosts:
#         - name: edge1
#           address: 192.0.2.254
#           version: 2c
#           community_env: PACKETEER_SNMP_COMMUNITY
#       providers:
#         - name: transit-a
#           host: edge1
#           interface: ether1
#           commit_mbps: 1000
#           billing_day: 1
#           percentile: greater_separate

# Routing policies and maintenance windows. Off unless listed. The chain is
# asked in order and the first policy that matches a prefix decides it.
# Policies only restrict or pin what the decision engine may choose: the RIB,
# allowlist, community, cap, and withdraw-on-failure rules still apply.
# The GeoIP database is yours to mount; Packeteer does not ship one.
# Docs: docs/CONFIG.md ("Policies").
# policies:
#   - type: maintenance
#     config:
#       timezone: UTC
#       windows:
#         - name: transit-b-weekly
#           providers: [transit-b]
#           schedule: "0 2 * * 6"   # minute hour day-of-month month day-of-week
#           duration: 2h
#   - type: rules
#     config:
#       geoip_db: /etc/packeteer/GeoLite2-Country.mmdb   # only needed for countries
#       rules:
#         - name: lab-static
#           action: static          # ignore, allow, deny, static, or vip
#           providers: [transit-a]
#           prefixes: [203.0.113.0/24]
#           max_loss_pct: 1         # required for static: pin only while loss <= 1%
#           max_rtt: 150ms          # optional latency ceiling for static
#         - name: no-b-for-64500
#           action: deny
#           providers: [transit-b]
#           asns: [64500]           # origin ASN of the learned path
#         - name: customers-via-a   # transit (customer-originated) traffic: its own policy
#           action: allow
#           providers: [transit-a]
#           traffic: transit        # transit or local; needs the flow source's transit block

# Plugins (docs/PLUGINS.md). Out-of-process plugins live in plugin_dir.
plugin_dir: /etc/packeteer/plugins
# Notifiers (docs/EVENTS.md). Each has its own events filter, min_severity,
# and rate_limit. Secrets come from the container environment.
# notifiers:
#   - type: webhook
#     config:
#       url: https://hooks.example.invalid/packeteer
#       headers:
#         Authorization: "Bearer ${HOOK_TOKEN}"
#   - type: webhook
#     name: chat
#     config:
#       preset: slack                   # slack, teams, pagerduty, or generic
#       url: ${SLACK_WEBHOOK_URL}
#       events: ["provider.*", "bgp.*", "commit.*", "outage.*"]
#   - type: webhook
#     name: pager
#     config:
#       preset: pagerduty
#       routing_key_env: PAGERDUTY_ROUTING_KEY
#       min_severity: critical          # recoveries still resolve the incident
#   - type: smtp
#     config:
#       host: smtp.example.invalid      # STARTTLS on 587 by default
#       username_env: PACKETEER_SMTP_USER
#       password_env: PACKETEER_SMTP_PASSWORD
#       from: packeteer@example.invalid
#       to: [noc@example.invalid]
#       min_severity: warning
#       rate_limit: 20                  # per rate_window (default 1m)
#   - type: snmptrap
#     config:
#       address: 192.0.2.162
#       community_env: PACKETEER_TRAP_COMMUNITY

# Email report subscriptions (#34): a stored report as CSV on a UTC
# schedule, sent by an smtp notifier (name it, or use its type). Needs
# storage. See docs/ui.md.
# report_subscriptions:
#   - name: weekly-summary
#     report: summary           # any name from /api/reports
#     schedule: weekly          # daily, weekly, or monthly (the 1st)
#     weekday: monday
#     at: "06:00"               # UTC
#     notifier: smtp
#   - name: monthly-savings
#     report: savings
#     schedule: monthly
#     notifier: smtp
#     to: [finance@example.invalid]   # replaces the notifier's to

# Upgrade from the UI (#196): the Settings page shows the running version,
# lists GitHub releases, upgrades to the one an admin picks (after a
# confirmation), and rolls back. Off unless enabled. A release is checked
# against public_key (the Ed25519 key that signs its SHA256SUMS) and the new
# binary must pass its start check against this file before anything changes.
# The switch shuts down as on SIGTERM (every Packeteer route withdrawn), then
# starts the new version in the configured mode; it learns the RIB again
# before it injects. Needs auth or basic auth. Rollback: enabled: false.
# Docs: docs/ui.md. Never announces.
# upgrade:
#   enabled: true
#   public_key: "<base64 Ed25519 public key>"
#   # check_interval: 24h      # background check, notify only (default off)

# Threat mitigation (#28, lab-proven only; see docs/mitigation.md): RTBH,
# BGP redirect, and FlowSpec drop / rate-limit / redirect (optionally by
# source country) for exact learned prefixes, added through POST
# /api/mitigations (basic auth). Off unless set. Its own mode defaults to
# observe (a dry run); inject also needs top-level mode: inject and an edge
# policy that opts in. Rules are in memory only and always expire.
# mitigation:
#   mode: observe
#   allowlist: [203.0.113.0/24]       # separate from allowlist.prefixes
#   max_rules: 10                     # routes; a country rule counts per network
#   default_ttl: 1h
#   max_ttl: 24h
#   # geoip_db: /etc/packeteer/GeoLite2-Country.mmdb   # you mount it; for source_countries
#   announcer:
#     type: gobgp
#     config:
#       marker: "64512:668"
#       blackhole:
#         next_hop: 192.0.2.66        # the edge routes this to null
#       redirect:
#         - name: scrubber
#           next_hop: 192.0.2.77
#           communities: ["64512:777"]
#       flowspec:                     # drop and rate-limit; redirect by route target
#         redirect:
#           - name: scrub-vrf
#             route_target: "64512:779"

# Traffic anomaly (DDoS) detection (#33, lab-proven only; see
# docs/anomaly.md). Off unless set. Needs a flow source. Every anomaly is
# logged, listed on /api/anomalies, and sent as anomaly.* events. A
# mitigation rule is added only when an explicit rule below matches, only
# through the mitigation block above (its mode, allowlist, cap, and TTL
# apply; observe is a dry run), and only for an exact learned prefix.
# anomaly:
#   interval: 10s
#   max_actions_per_hour: 6
#   max_active: 4
#   detector:
#     type: baseline
#     config:
#       sensitivity: 3                # standard deviations; lower fires sooner
#       min_ratio: 3
#       min_mbps: 50
#       warmup: 30                    # rounds before a key can fire
