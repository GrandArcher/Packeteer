# Example only. Keep mode: observe in this repository.
# Every key, default, and bound: docs/CONFIG.md
mode: observe

asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
max_improvements: 50
hold_time: 15m              # min life of an improvement; also cooldown after a flip-back
improvement_ttl: 1h         # re-measure the native path after this long. A path the router keeps advertising is withdrawn when it disappears; a path hidden because Packeteer's route won waits for this TTL

thresholds:
  min_loss_delta_pct: 1.0
  min_rtt_delta_ms: 15

providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
    # exclude: true           # measure, but never steer traffic to this provider
    # group: edge             # load-balance with other providers in this group
    # precedence: 100         # lower is preferred; 0 or omitted means 100
    # cc_disable: false       # true: leave this provider out of commit control
    # cost: 5                 # price per Mbps; the cost scorer only moves between priced providers
    # bmp: prefer             # off (default), prefer, or only: use this provider's BMP paths (rib_sources)

allowlist:
  prefixes: []

probe:
  interval: 30s               # also how often stale improvements are re-checked if a round never finishes
  timeout: 2s                 # per packet. A whole round is bounded (~3 intervals) so a stuck prober cannot pin routes
  packets: 10
  workers: 8                  # concurrent probe runs
  rate_limit_pps: 100         # global cap on probe packets per second
  per_target_concurrency: 2   # concurrent runs toward one destination host
  # retry_loss_pct: 20        # 0 (default) disables. Re-probe before storing a lossy sample.
  # retry_packets: 30         # default is 3x packets when retry_loss_pct is set

# Probers are tried in order: ICMP echo, then TCP connect to port 443 when
# ICMP errors or gets no replies. This is also the default when omitted.
probers:
  - type: icmp
  - type: tcp
    config:
      port: 443
  # - type: udp               # optional fallback. A reply or ICMP port-unreachable counts.
  #   config:
  #     port: 33434

# Path scoring (lower is better): loss dominates, then latency, then jitter.
# `weighted` is the default and does not steer for commit. `commit` uses the
# same score and, with telemetry plus flow volume, keeps providers under
# their commit. Leave this as weighted unless you want that.
scorer:
  type: weighted
  config: {loss_weight: 100, rtt_weight: 1, jitter_weight: 0.5}
# scorer:
#   type: commit
#   config:
#     loss_override: false    # true allows a commit move onto higher loss
#     balance: off            # off, equal, or proportional
#     balance_slack: 0.10
#     max_age: 15m            # ignore telemetry older than this
#     min_mbps: 0
# `cost` uses the same score and moves prefixes to the cheapest provider
# (providers[].cost) whose path is inside the floor versus the best path.
# Needs cost on at least two providers. Rollback: switch back to weighted.
# scorer:
#   type: cost
#   config:
#     precedence: performance # performance (default) or cost
#     floor:
#       max_loss_pct: 0       # extra loss allowed over the best path
#       max_rtt: 10ms         # extra latency allowed over the best path

# What to probe. Uncomment and use prefixes you actually serve traffic to.
# The flow source is off unless you add it. With --network host its UDP
# ports are host ports; do not publish them. Docs: docs/mikrotik.md.
# sources:
#   - type: static
#     config:
#       targets:
#         - prefix: 198.51.100.0/24
#           host: 198.51.100.1        # optional; defaults to the first address
#           mbps: 0                   # optional; declared Mbps for the commit scorer
#         - prefix: 203.0.113.0/24
#   - type: flow
#     config:
#       listen:
#         - "0.0.0.0:2055"            # NetFlow v5/v9 and IPFIX
#         - "0.0.0.0:6343"            # sFlow
#       window: 5m
#       top_n: 100
#       min_bytes: 1000000
#       aggregate_v4: 24
#       aggregate_v6: 48
#       exclude:
#         - 192.0.2.0/24              # destinations inside these prefixes are ignored
#       # problems:                 # optional: score TCP failures from unsampled v5/v9/IPFIX
#       #   local: [192.0.2.0/24]     # your own networks
#       #   failure_pct: 20           # SYN-without-ACK plus remote RST, % of flows
#       #   min_flows: 10
#   - type: span                # passive problem detection from a mirror port. Needs NET_RAW.
#     config:                   # Does not announce; problem prefixes are probed first.
#       interface: eth1         # mirror NIC; or pcap_file: /etc/packeteer/span.pcap (lab replay)
#       local:
#         - 192.0.2.0/24        # your own networks (required)
#       window: 5m
#       retrans_pct: 5          # outbound retransmissions, % of data segments
#       failure_pct: 20         # handshake timeouts plus remote resets, % of connections
#       # rtt_ms: 0             # handshake RTT threshold; 0 disables
#       max_targets: 100
#   - type: traceroute          # last stable hop when the host does not answer.
#     config:                   # Discovery is background. Targets returns the cache.
#       interval: 5m
#       budget: 10s             # one pass; under the default round deadline
#       targets:
#         - prefix: 198.51.100.0/24
#           host: 198.51.100.1
#   - type: vip                 # own interval. ASNs match the learned path only.
#     config:                   # interval must be inside the staleness window.
#       interval: 10s
#       max_targets: 100        # cap on prefixes plus ASN matches
#       prefixes:
#         - prefix: 203.0.113.0/24
#           host: 203.0.113.1
#       asns:
#         - 64496
#   - type: outage              # re-probe when many prefixes fail together. Does not announce.
#     config:
#       min_prefixes: 3         # minimum is 2; one noisy prefix never fires
#       window: 2m
#       loss_pct: 20            # 0 uses this default
#       # rtt_ms: 200           # also treat high RTT as degraded; 0 disables
#       interval: 5s            # shorter than probe.interval and the staleness window
#       max_targets: 100
#       ignore_asns:
#         - 64512               # an ASN that sits on every learned path

# iBGP to the edge router(s). Same ASN as `asn`. The session learns best
# paths and, only in mode: inject, carries improvements back. Graceful
# restart is never enabled. Packeteer proposes a 90s hold time; the router's
# shorter timer wins. Filters: docs/mikrotik.md and docs/routers.md.
# bgp:
#   listen_port: 179            # optional; 0/omitted = connect out only
#   # listen_addresses: ["192.0.2.10"]
#   neighbors:
#     - address: 192.0.2.254
#       # port: 179             # remote port; 0/omitted = 179
#       # local_address: 192.0.2.10
#       # passive: false        # true waits for the router and needs listen_port
#       description: edge1

# Injection (used only when mode: inject). local_pref is set on every
# injected route and should beat the edge's native local preference.
# The announcer publishes that exact learned prefix and adds NO_EXPORT.
# more_specific_bits is rejected.
# local_pref: 250
# announcer:
#   type: gobgp

# BMP monitoring station (RIB source). Edge routers stream their post-policy
# Adj-RIB-In (routes they accepted) here, so Packeteer sees inactive IX and backup paths without a
# full iBGP feed. Needs bgp.neighbors (the announcer uses that session).
# Providers opt in with `bmp: prefer` or `bmp: only`; those get a route
# check: no improvement onto a provider that is not advertising the exact
# prefix, and an active one is retired when it withdraws. Learn-only; never
# announces. With --network host the port is a host port: firewall it to
# the routers. Docs: docs/CONFIG.md ("RIB source bmp").
# rib_sources:
#   - type: bmp
#     config:
#       listen: ":11019"
#       routers: [192.0.2.254]
#       policy: post            # the only accepted value; pre-policy routes are refused
#       loc_rib: true
#       idle_timeout: 0         # e.g. 90s, above the router's BMP stats interval; 0 = TCP keepalive only

# Process log. level: debug, info, warn, or error.
# format: text or json. PACKETEER_LOG_LEVEL and PACKETEER_LOG_FORMAT override these.
log:
  level: info
  format: text

# Read-only dashboard, JSON API, and Prometheus metrics. GET and HEAD only.
# Empty listen disables the server. PACKETEER_HTTP_LISTEN overrides this
# ("off" disables). With --network host, 127.0.0.1:8080 is the host loopback.
# The image exposes port 8080. Optional basic auth (set both, or neither):
# PACKETEER_HTTP_USER and PACKETEER_HTTP_PASSWORD.
http:
  listen: "127.0.0.1:8080"

# Report history (improvements, before/after loss and latency, provider
# efficiency, top prefixes/ASNs/countries, probes per day, cost savings) on
# the dashboard and /api/reports. An embedded SQLite file. Mount a volume on
# /var/lib/packeteer so it survives a restart. Delete this block to turn
# history off; probing and decisions do not depend on it. Does not announce.
storage:
  type: sqlite
  config:
    path: /var/lib/packeteer/packeteer.db
    retention: 9600h            # 400 days

# Troubleshooting tools on the ops server (/api/troubleshoot, dashboard).
# The looking glass (learned RIB) is always on. enabled: true adds an
# on-demand probe and traceroute from every provider source and a whois
# (RDAP) lookup, rate limited. Read-only: nothing here announces.
# troubleshoot:
#   enabled: true
#   requests_per_minute: 6
#   max_hops: 30
#   whois:
#     type: rdap
#     config:
#       base_url: https://rdap.org

# Interface counters and 95th-percentile usage. Off unless listed.
# The community and v3 passphrases are environment variables named here,
# never values in this file. The collector does not announce.
# Docs: docs/PLUGINS.md and docs/CONFIG.md.
# telemetry:
#   - type: snmp
#     config:
#       interval: 5m
#       hosts:
#         - name: edge1
#           address: 192.0.2.254
#           version: 2c
#           community_env: PACKETEER_SNMP_COMMUNITY
#       providers:
#         - name: transit-a
#           host: edge1
#           interface: ether1
#           commit_mbps: 1000
#           billing_day: 1
#           percentile: greater_separate

# Routing policies and maintenance windows. Off unless listed. The chain is
# asked in order and the first policy that matches a prefix decides it.
# Policies only restrict or pin what the decision engine may choose: the RIB,
# allowlist, community, cap, and withdraw-on-failure rules still apply.
# The GeoIP database is yours to mount; Packeteer does not ship one.
# Docs: docs/CONFIG.md ("Policies").
# policies:
#   - type: maintenance
#     config:
#       timezone: UTC
#       windows:
#         - name: transit-b-weekly
#           providers: [transit-b]
#           schedule: "0 2 * * 6"   # minute hour day-of-month month day-of-week
#           duration: 2h
#   - type: rules
#     config:
#       geoip_db: /etc/packeteer/GeoLite2-Country.mmdb   # only needed for countries
#       rules:
#         - name: lab-static
#           action: static          # ignore, allow, deny, static, or vip
#           providers: [transit-a]
#           prefixes: [203.0.113.0/24]
#           max_loss_pct: 1         # required for static: pin only while loss <= 1%
#           max_rtt: 150ms          # optional latency ceiling for static
#         - name: no-b-for-64500
#           action: deny
#           providers: [transit-b]
#           asns: [64500]           # origin ASN of the learned path

# Plugins (docs/PLUGINS.md). Out-of-process plugins live in plugin_dir.
plugin_dir: /etc/packeteer/plugins
# Notifiers (docs/EVENTS.md). Each has its own events filter, min_severity,
