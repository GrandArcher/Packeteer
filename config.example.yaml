# Inbound optimization (#25, lab-proven only; see docs/inbound.md). Off
# unless set. Its own mode defaults to observe; suggest publishes the steer on
# /api/inbound and as inbound.* events; inject also needs top-level mode:
# inject and an edge policy that opts in. The commit trigger needs a
# telemetry plugin; the performance trigger reads the probes.
# inbound:
#   mode: observe
#   prefixes: [203.0.113.0/24]        # your own prefixes, inside the allowlist
#   release_pct: 90
#   performance: {}                   # steer away from the worst performer
#   damping:                          # inertia against oscillation (defaults)
#     confirm: 1m
#     backoff: 2
#   moderated: [performance]          # suggest-only, even in inject
#   announcer:
#     type: gobgp
#     config:
#       marker: "64512:667"
