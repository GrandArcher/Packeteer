name: realtable

# Opt-in replay of a real public full table (#342). Manual only: it never
# runs on pull requests, pushes or a schedule, and no other workflow calls
# it. Lab only: lab/realtable.sh downloads the latest RIPE RIS bview at run
# time, plays one peer's view to the stock image over loopback with next
# hops rewritten to documentation addresses, and Packeteer runs in observe
# mode. The dump is never committed or uploaded; the job log and the result
# artifact hold counts and timings only.
#
# Peak RSS measured on an 8-core development machine (2026-10-22, current
# rrc00 bview): 3.4 GiB at 1x, 6.7 GiB at 2x, 9.2 GiB at 3x. 3x fits
# ubuntu-latest (16 GB); 4x may not, so name a larger runner label.
#
# Profile realtable3m (#103) plays three peers' views of the dump, grows the
# table to 3 million prefixes, and gives it simulated probe results (a model;
# no packet is sent). It holds about 8 million paths. The realtable runs
# above peaked at about 3 GiB per million paths, so expect about 25 GiB;
# name a runner with at least 32 GB. Nothing has measured this profile yet.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: realtable (one peer, N sessions) or realtable3m (three peers, 3 million prefixes, simulated probes)
        type: choice
        options: ["realtable", "realtable3m"]
        default: "realtable"
      multiply:
        description: Sessions, so Packeteer holds this many paths per prefix
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
      runner:
        description: Runner label (default ubuntu-latest)
        default: ""

permissions:
  contents: read

jobs:
  realtable:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: packeteer:realtable
          build-args: VERSION=realtable-${{ github.sha }}
      - name: real table, observe only (lab/soak/budgets.yaml, profile from the input)
        env:
          SOAK_OUT: realtable-result.json
          MULTIPLY: ${{ inputs.multiply }}
          REALTABLE_PROFILE: ${{ inputs.profile }}
        run: bash lab/realtable.sh packeteer:realtable "$MULTIPLY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.profile }}-result-${{ inputs.multiply }}x
          path: realtable-result.json
          if-no-files-found: ignore
