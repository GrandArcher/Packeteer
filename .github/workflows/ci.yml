              && jq -e '([.components[] | select(.kind == "notifier" and .name == "hook" and .state == "down")] | length) == 1
                and ([.components[] | select(.kind == "probe_source" and .name == "lab-dead" and .state == "down")] | length) == 1' /tmp/sys184.json >/dev/null; then ok=1; break; fi
