          grep -q 'mode: observe' /tmp/merged131.yaml
          ! grep -q 'announcer' /tmp/merged131.yaml
          jq -n --rawfile y /tmp/merged131.yaml '{yaml:$y}' | curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d @- "$base/api/config/validate" | tee /tmp/validate131.json
          jq -e '.valid == true and .mode == "observe" and .enables_inject == false' /tmp/validate131.json
          # The form cannot turn inbound inject on.
          jq '.form | .inbound.mode = "inject"' /tmp/form131.json >/tmp/form131-inject.json
          jq -n --arg y "$yaml" --slurpfile f /tmp/form131-inject.json '{yaml:$y,apply:true,form:$f[0]}' \
            | curl -sS "${auth[@]}" -H 'Content-Type: application/json' -d @- "$base/api/config/form" | jq -e '.error | test("inbound.mode inject")'
          go build -o /tmp/uiproxy ./lab/uiproxy
