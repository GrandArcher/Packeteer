            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18135/healthz >/dev/null
          bash lab/ui-smoke.sh http://127.0.0.1:18135/protection.html \
            'mode-observe' 'It announces nothing.' 'Threat mitigation' 'Add a rule' 'Prefix (learned, inside the allowlist)' \
            'observe: rules are recorded and shown here. Nothing is announced.' 'Inbound and anomaly rules' \
            --absent 'Cannot reach' 'mode-inject'
          bash lab/ui-smoke.sh http://127.0.0.1:18135/settings.html \
            'mode-observe' 'It announces nothing.' 'Inbound optimization' 'value="198.51.100.0/24"' 'value="50"' \
            'Anomaly rules' 'value="udp-flood"' 'value="flowspec_drop"' 'value="30m"' \
            --absent 'The config editor is off' 'mode-inject'
          # The same guided-input driver (#329) on the inbound and anomaly
          # file. Apply leaves the YAML unchanged and writes nothing.
          kill "$proxy"
          /tmp/uiproxy -listen 127.0.0.1:18139 -upstream "$base" -user lab -password lab-only \
            -fixtures lab/ui-fixtures/guided >/tmp/uiproxy329b.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18139/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18139/healthz >/dev/null
          bash lab/ui-smoke.sh http://127.0.0.1:18139/settings.html 'mode-observe' 'It announces nothing.' \
            'guided: yaml-same: true writes: 0 decision: yes providers: yes flow: yes policy: no vip: no outage: no exchange: no inbound: yes anomaly: yes inbound-prefix: 198.51.100.0/24 anomaly-name: udp-flood cidr-error: Enter a prefix, for example 192.0.2.0/24.' \
            --absent 'mode-inject'
      - name: UI settings sections smoke (#330; every block drawn from the file, edit, preview diff, save from the form, observe)
        run: |
          set -euo pipefail
          # The page and the merge are the binary's. It runs on the runner
          # because Save renames a file into the config's directory, which
          # a single-file container mount does not allow. No router is
          # reachable, nothing is announced, and the mode stays observe.
          mkdir -p /tmp/ui330
          cp lab/ui-fixtures/sections/config.yaml /tmp/ui330/config.yaml
          go build -o /tmp/ui330/pk ./cmd/controller
          go build -o /tmp/ui330/uiproxy ./lab/uiproxy
          pk=""
          proxy=""
          cleanup() {
            if [ -n "$proxy" ]; then kill "$proxy" 2>/dev/null || true; fi
            if [ -n "$pk" ]; then kill "$pk" 2>/dev/null || true; wait "$pk" 2>/dev/null || true; fi
            tail -n 20 /tmp/ui330/pk.log || true
          }
          trap cleanup EXIT
          # A fresh password per run, handed to curl through a config file,
          # so no credential is written into this workflow.
          pw=$(openssl rand -hex 12)
          (umask 077; printf 'user = "lab:%s"\n' "$pw" >/tmp/ui330/curl.cfg)
          PACKETEER_HTTP_USER=lab PACKETEER_HTTP_PASSWORD="$pw" \
            PACKETEER_SNMP_COMMUNITY=lab-only-community PACKETEER_SNMP_USER=labuser \
            PACKETEER_SNMP_AUTH=lab-auth-secret PACKETEER_SNMP_PRIV=lab-priv-secret \
            /tmp/ui330/pk -config /tmp/ui330/config.yaml >/tmp/ui330/pk.log 2>&1 &
          pk=$!
          auth=(-K /tmp/ui330/curl.cfg)
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "${auth[@]}" http://127.0.0.1:18330/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          curl -fsS "${auth[@]}" http://127.0.0.1:18330/api/config/schema | jq -e '(.blocks | map(.id)) | contains(["scorer","bgp","bmp","maintenance","inbound_announcer","anomaly","mitigation","http"])'
          /tmp/ui330/uiproxy -listen 127.0.0.1:18331 -upstream http://127.0.0.1:18330 -user lab -password "$pw" \
            -fixtures lab/ui-fixtures/sections >/tmp/ui330/proxy.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18331/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18331/healthz >/dev/null
          # Headless Chrome cannot click, so the driver in the fixture does.
          # It edits each block, previews, and saves once. The page is one
          # run: a retry would start from the saved file.
          UI_SMOKE_ATTEMPTS=1 bash lab/ui-smoke.sh http://127.0.0.1:18331/settings.html \
            'mode-observe' 'It announces nothing.' \
            'render: scorer yes | bgp yes | bmp yes | maintenance yes | announcer yes | anomaly yes | mitigation yes | http yes | inject yes | flow yes | peer yes | provider-bmp yes | plugins 2 | snmp-v3 yes | inject-box hidden | raw-yaml yes' \
            'hidden: yes | url shown no | community shown no' \
            'unchanged: yaml-same true | writes 0' \
            'mode: inject-box true | gone again true' \
            'mapped: use a schedule with a duration, or a start with an end, not both' \
            'required: This field is required.' \
            'bad ip: Enter an IP address.' \
            'preview: Valid | loss_weight yes | failure_pct yes | neighbor yes | peer yes | bmp only yes | port yes | context yes | prober yes | timeout yes | restart yes | writes 0' \
            'writes 1 | comment kept yes | loss_weight yes | bmp only yes | prober yes | webhook url kept yes | mode observe yes' \
            'after save: Valid. Nothing differs from the file.' \
            --absent 'id="sec-jserr"' 'id="sec-error"' 'id="sec-timeout"' 'mode-inject'
          # The file on disk is what the form wrote: still observe, the
          # operator's comment and webhook URL kept, the edits in.
          grep -q '^mode: observe$' /tmp/ui330/config.yaml
          grep -q '^# Config for the settings sections smoke test' /tmp/ui330/config.yaml
          grep -q 'url: http://127.0.0.1:9/lab' /tmp/ui330/config.yaml
          grep -q 'loss_weight: 200' /tmp/ui330/config.yaml
          grep -q 'bmp: only' /tmp/ui330/config.yaml
          ! grep -q 'lab-only-community\|lab-auth-secret\|lab-priv-secret' /tmp/ui330/config.yaml
