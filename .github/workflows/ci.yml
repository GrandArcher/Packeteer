          # and the one for tomorrow is listed with the UTC time that was sent.
          curl -fsS "${auth[@]}" "$base/api/maintenance" | tee /tmp/maint177.json
          jq -e '(.windows | length) == 0 and (.upcoming | map(.source) | sort) == ["api", "schedule"] and (.upcoming[] | select(.source == "api") | .start | endswith("T04:30:00Z") and (. | startswith("2099") | not)) and (.finished | length) == 1' /tmp/maint177.json
          # A viewer sees the list and no form. uiproxy answers /api/me as a
          # viewer and /api/maintenance with one window per state; the driver
          # reports the hidden form, no Close button, and no write call.
          kill "$proxy"
          /tmp/uiproxy -listen 127.0.0.1:18179 -upstream "$base" -user lab -password lab-only \
