            'badge sys-down' 'badge sys-ok' 'announces nothing in observe mode' 'connection refused' \
            --absent 'Cannot reach' 's3cr3t-token' 'Inject mode'
          bash lab/ui-smoke.sh "$base/" 'Observe mode' 'System page' 'href="/system.html"' --absent 'Cannot reach' 's3cr3t-token'
          docker stop -t 15 pkui184
          test "$(docker inspect -f '{{.State.ExitCode}}' pkui184)" = "0"
          docker rm pkui184
