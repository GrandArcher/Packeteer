      - name: UI commit smoke (#174; 95th vs commit graph from seeded samples, commit setup flow, observe)
        run: |
          set -euo pipefail
          base=http://127.0.0.1:18174
          # Samples and commit improvements for two providers on documentation
          # names, written by the same sqlite plugin the image uses. lab-a ends
          # the window over its 100 Mbps commit, lab-b is far under. lab-c has a
