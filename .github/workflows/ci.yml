          curl -fsS "${auth[@]}" "$base/api/mitigations" | jq -e '.mitigation_mode == "observe" and .routes_held == 1 and .routes_announced == 0 and (.rules | length) == 1'
          curl -fsS "${auth[@]}" -X DELETE "$base/api/mitigations/$(jq -r .id /tmp/mit131.json)" -o /dev/null
          curl -fsS "${auth[@]}" "$base/api/mitigations" | jq -e '.routes_held == 0 and .routes_announced == 0 and (.rules | length) == 0'
