            -v /tmp/ui177.yaml:/etc/packeteer/config.yaml:ro packeteer:ci
          proxy=""
          cleanup() {
            if [ -n "$proxy" ]; then kill "$proxy" 2>/dev/null || true; fi
            docker stop -t 15 pkui177 >/dev/null || true
            docker logs pkui177 2>&1 | tail -n 40
            code="$(docker inspect -f '{{.State.ExitCode}}' pkui177)"
            docker rm pkui177 >/dev/null || true
            test "$code" = "0"
          }
          trap cleanup EXIT
          auth=(-u lab:lab-only)
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "${auth[@]}" "$base/healthz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          curl -fsS "${auth[@]}" "$base/api/maintenance" | jq -e '.configured and .on_demand and (.windows | length) == 0 and (.upcoming | map(.id)) == ["schedule-far-lab"] and (.finished | map(.id)) == ["schedule-past-lab"]'
          # Headless Chrome cannot click, so uiproxy adds a driver to
          # /policies.html. It fills the form, opens a window tomorrow at
          # 10:00 and one from now, and closes the current one. Chrome runs in
          # Asia/Kolkata (UTC+5:30): 10:00 typed is shown as 10:00 and sent as
          # 04:30Z. The page is the image's; the calls are the API's.
          go build -o /tmp/uiproxy ./lab/uiproxy
          /tmp/uiproxy -listen 127.0.0.1:18178 -upstream "$base" -user lab -password lab-only \
            -fixtures lab/ui-fixtures/maintenance >/tmp/uiproxy177.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18178/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18178/healthz >/dev/null
          TZ=Asia/Kolkata UI_SMOKE_ATTEMPTS=1 bash lab/ui-smoke.sh http://127.0.0.1:18178/policies.html \
            'mode-observe' 'It announces nothing.' 'Maintenance windows' \
            'before: upcoming|lab-b|' '|configured|| ; finished|lab-a|' '|configured|old|' \
            'open: current|lab-a|' '|on demand||Close ; upcoming|lab-b|' ' 10:00:00' '|on demand|fiber work|Close ; upcoming|lab-b|' \
            'T04:30:00.000Z","end":"' 'T06:30:00.000Z","reason":"fiber work"}' \
            'closed: upcoming|lab-b|' 'status [Closed api-2.]' \
            --absent 'Cannot reach' 'mode-inject' 'closed: current'
          # The page's calls reached the real API: the closed window is gone,
          # and the one for tomorrow is listed with the UTC time that was sent.
          curl -fsS "${auth[@]}" "$base/api/maintenance" | tee /tmp/maint177.json
          jq -e '(.windows | length) == 0 and (.upcoming | map(.source) | sort) == ["api", "schedule"] and (.upcoming[] | select(.source == "api") | .start | endswith("T04:30:00Z") and (. | startswith("2099") | not)) and (.finished | length) == 1' /tmp/maint177.json
          # A viewer sees the list and no form. uiproxy answers /api/me as a
          # viewer and /api/maintenance with one window per state; the driver
          # reports the hidden form, no Close button, and no write call.
          kill "$proxy"
          /tmp/uiproxy -listen 127.0.0.1:18179 -upstream "$base" -user lab -password lab-only \
            -fixtures lab/ui-fixtures/maintenance-viewer >/tmp/uiproxy177v.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18179/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18179/healthz >/dev/null
          UI_SMOKE_ATTEMPTS=1 bash lab/ui-smoke.sh http://127.0.0.1:18179/policies.html \
            'mode-observe' 'It announces nothing.' 'Opening and closing a window needs the operator role.' \
            'viewer: form hidden true close buttons 0 writes 0 rows current|lab-a|' '|on demand|fiber work| ; upcoming|lab-b|' ' ; finished|lab-a, lab-b|' \
            --absent 'Cannot reach' 'mode-inject'
      - name: auth in the stock image (users, roles, tokens, audit, rollback; observe)
        run: |
          cat > /tmp/auth.yaml <<'YAML'
          mode: observe
          asn: 64512
          router_id: 192.0.2.10
          http:
            listen: "127.0.0.1:18084"
            allow_from: [127.0.0.0/8]
          providers:
            - name: lab-a
              source_ip: 127.0.0.1
              next_hop: 127.0.0.1
          probe: {interval: 2s, timeout: 200ms, packets: 2}
          probers:
            - type: fixed
              config:
                paths: [{provider: lab-a, rtt_ms: 10}]
          storage:
            type: sqlite
          auth:
            enabled: true
          YAML
          sed 's/^  enabled: true$/  enabled: false/' /tmp/auth.yaml > /tmp/noauth.yaml
          base=http://127.0.0.1:18084
          json='Content-Type: application/json'
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          up() {
            for _ in $(seq 1 20); do curl -fsS "$base/healthz" >/dev/null 2>&1 && return 0; sleep 1; done
            docker logs pkauth >&2; return 1
          }
          start() {
            docker run -d --name pkauth --network host --cap-add NET_RAW --cap-add NET_ADMIN "$@" \
              -v pkauth:/var/lib/packeteer packeteer:ci
            up
          }
          # HTTP listens before the store opens and the admin is bootstrapped;
          # wait for the credentials to work before asserting on them.
          authup() {
            for _ in $(seq 1 20); do test "$(code -u "$1" $base/api/me)" = 200 && return 0; sleep 1; done
            docker logs pkauth >&2; return 1
          }
          stop() {
            docker stop -t 15 pkauth
            docker logs pkauth 2>&1 | tail -n 30
            test "$(docker inspect -f '{{.State.ExitCode}}' pkauth)" = "0"
            docker rm pkauth
          }
          docker volume create pkauth
          start -e PACKETEER_ADMIN_PASSWORD=ci-admin-password-1 -v /tmp/auth.yaml:/etc/packeteer/config.yaml:ro
          authup admin:ci-admin-password-1
          test "$(code $base/healthz)" = 200
          test "$(code $base/api/providers)" = 401
          test "$(code -u admin:wrong-password-x $base/api/providers)" = 401
          test "$(code -u admin:ci-admin-password-1 $base/api/providers)" = 200
          test "$(code -u admin:ci-admin-password-1 -H "$json" -d '{"name":"viewer1","role":"viewer","password":"ci-viewer-password"}' $base/api/users)" = 201
          test "$(code -u viewer1:ci-viewer-password $base/api/providers)" = 200
          test "$(code -u viewer1:ci-viewer-password -H "$json" -d '{"name":"x","role":"admin","password":"ci-viewer-password"}' $base/api/users)" = 403
          test "$(code -u viewer1:ci-viewer-password $base/api/audit)" = 403
          tok="$(curl -fsS -u viewer1:ci-viewer-password -H "$json" -d '{"name":"ci"}' $base/api/tokens | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          test -n "$tok"
          test "$(code -H "Authorization: Bearer $tok" $base/metrics)" = 200
          curl -fsS -u admin:ci-admin-password-1 "$base/api/audit" | tee /tmp/audit.json
          grep -q '"action":"auth.bootstrap"' /tmp/audit.json
          grep -q '"actor":"admin","role":"admin","method":"password","remote":"127.0.0.1","action":"POST /api/users","target":"viewer1","result":"ok"' /tmp/audit.json
          grep -q '"actor":"viewer1","role":"viewer","method":"password","remote":"127.0.0.1","action":"POST /api/users","result":"denied"' /tmp/audit.json
          grep -q '"action":"POST /api/tokens"' /tmp/audit.json
          if grep -q "$tok" /tmp/audit.json; then echo "token secret in the audit log"; exit 1; fi
          # Sign-in page (#176): a browser without a session lands on it, a
          # local user signs in with the form's call, browses on the cookie,
          # and signs out; basic auth and the token above keep working.
          bash lab/ui-smoke.sh "$base/" 'id="signin-form"' 'Observe mode: Packeteer measures and recommends. It announces nothing.' \
            'alt="Packeteer logo"' 'src="/logo.png"' 'rel="icon" href="/logo.png"' \
            --absent 'id="account"' 'Cannot reach' 'docs/assets'
          test "$(code -H "$json" -d '{"name":"viewer1","password":"wrong-password-x"}' $base/auth/signin)" = 401
          curl -sS -D /tmp/signin.hdr -o /dev/null -H "$json" -d '{"name":"viewer1","password":"ci-viewer-password"}' $base/auth/signin
          tr -d '\r' </tmp/signin.hdr | grep -i '^set-cookie: packeteer_session=' | grep -q 'HttpOnly; Secure; SameSite=Strict'
          sess="$(tr -d '\r' </tmp/signin.hdr | sed -n 's/^[Ss]et-[Cc]ookie: \(packeteer_session=[^;]*\).*/\1/p')"
          test -n "$sess"
          curl -fsS -H "Cookie: $sess" $base/api/me | grep -q '"user":"viewer1".*"session":true'
          test "$(code -H "Cookie: $sess" $base/)" = 200
          test "$(code -H "Cookie: $sess" $base/api/audit)" = 403
          test "$(code -X POST -H "Cookie: $sess" $base/auth/logout)" = 204
          test "$(code -H "Cookie: $sess" $base/api/me)" = 401
          test "$(code -u viewer1:ci-viewer-password $base/api/providers)" = 200
          curl -fsS -u admin:ci-admin-password-1 "$base/api/audit" | tee /tmp/audit2.json
          grep -q '"action":"auth.login","target":"viewer1","result":"denied"' /tmp/audit2.json
          grep -q '"actor":"viewer1","role":"viewer","method":"password","remote":"127.0.0.1","action":"auth.login"' /tmp/audit2.json
          grep -q '"actor":"viewer1","method":"password","remote":"127.0.0.1","action":"auth.logout","target":"viewer1","result":"ok"' /tmp/audit2.json
          if grep -q 'wrong-password-x\|ci-viewer-password' /tmp/audit2.json; then echo "password in the audit log"; exit 1; fi
          # Users and Tokens pages (#175). The proxy signs the browser in with
          # basic auth. The admin sees the users made above, with row actions;
          # the viewer sees no Users page, only its own token. Observe banner
          # on both.
          go build -o /tmp/uiproxy ./lab/uiproxy
          /tmp/uiproxy -listen 127.0.0.1:18187 -upstream "$base" -user admin -password ci-admin-password-1 >/tmp/uiproxy175a.log 2>&1 &
          padmin=$!
          /tmp/uiproxy -listen 127.0.0.1:18188 -upstream "$base" -user viewer1 -password ci-viewer-password >/tmp/uiproxy175v.log 2>&1 &
          pviewer=$!
          for port in 18187 18188; do
            for _ in $(seq 1 20); do curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null 2>&1 && break; sleep 0.2; done
            curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null
          done
          bash lab/ui-smoke.sh http://127.0.0.1:18187/admin.html 'It announces nothing.' 'mode-observe' 'Add a local user' \
            '>viewer1<' 'aria-label="Change role of viewer1"' 'aria-label="Reset password of viewer1"' 'aria-label="Delete viewer1"' \
            --absent 'id="users-off" class="empty">' 'Your account may not read this page.' 'Cannot reach'
          bash lab/ui-smoke.sh http://127.0.0.1:18187/tokens.html 'It announces nothing.' 'Create a token' '>viewer1<' '>ci<' 'aria-label="Revoke token ci of viewer1"' \
            --absent 'pkt_' 'Cannot reach'
          bash lab/ui-smoke.sh http://127.0.0.1:18188/admin.html 'It announces nothing.' 'Your account may not read this page.' \
            --absent 'aria-label="Delete admin"' 'aria-label="Delete viewer1"'
          bash lab/ui-smoke.sh http://127.0.0.1:18188/tokens.html 'It announces nothing.' 'Create a token' '>ci<' \
            --absent 'pkt_' 'Cannot reach'
          # Events and audit log (#173). The admin's Audit tab lists the
          # changes made above by actor, action, and target, and never a
          # secret. The viewer sees the events but no Audit tab, and the
          # audit read is refused for it.
          bash lab/ui-smoke.sh http://127.0.0.1:18187/events.html#audit 'It announces nothing.' 'mode-observe' \
            '>admin<' '>POST /api/users<' '>viewer1<' '>POST /api/tokens<' 'id="panel-audit" role="tabpanel" aria-labelledby="tab-audit">' \
            --absent 'pkt_' 'ci-viewer-password' 'ci-admin-password-1' 'Cannot reach' 'Your account may not read'
          bash lab/ui-smoke.sh http://127.0.0.1:18188/events.html 'It announces nothing.' 'controller.started' \
            'id="tab-audit" aria-selected="false" aria-controls="panel-audit" data-min-role="admin" hidden=""' \
            --absent 'Cannot reach'
          bash lab/ui-smoke.sh http://127.0.0.1:18188/events.html#audit 'Your account may not read the audit log.' \
            --absent 'POST /api/users'
          kill "$padmin" "$pviewer"
          stop
          # Restart on the same volume: users and tokens persist, and the
          # bootstrap variable never resets an existing admin.
          start -e PACKETEER_ADMIN_PASSWORD=a-different-password -v /tmp/auth.yaml:/etc/packeteer/config.yaml:ro
          authup admin:ci-admin-password-1
          test "$(code -u admin:ci-admin-password-1 $base/api/providers)" = 200
          test "$(code -u admin:a-different-password $base/api/providers)" = 401
          # Events survive the restart (#173): this run's start and the
          # first run's start and stop are all in the stored log.
          curl -fsS -u admin:ci-admin-password-1 "$base/api/events" | tee /tmp/events.json | jq -e '.stored == true and ([.events[] | select(.kind == "controller.started")] | length) >= 2 and ([.events[].kind] | index("controller.stopping")) != null'
          test "$(code -H "Authorization: Bearer $tok" $base/api/providers)" = 200
          stop
          # Rollback (#328): auth.enabled: false. Reads work, every change is refused.
          start -v /tmp/noauth.yaml:/etc/packeteer/config.yaml:ro
          test "$(code $base/api/providers)" = 200
          test "$(code -H "$json" -d '{"name":"x","role":"admin","password":"ci-viewer-password"}' $base/api/users)" = 404
          test "$(code -H "$json" -d '{"prefix":"198.51.100.0/24","action":"blackhole"}' $base/api/mitigations)" = 403
          stop
          docker volume rm pkauth
      - name: span source smoke test (mounted pcap fixture, observe)
        run: |
          cat > /tmp/span.yaml <<'YAML'
          mode: observe
          asn: 64512
          router_id: 192.0.2.10
          auth: {enabled: false}
          http:
            listen: "127.0.0.1:18082"
          providers:
            - name: lab-a
              source_ip: 127.0.0.1
              next_hop: 127.0.0.1
          probe: {interval: 2s, timeout: 500ms, packets: 3}
          probers:
            - type: fixed
              config:
                paths: [{provider: lab-a, rtt_ms: 10}]
          sources:
            - type: span
              config:
                pcap_file: /etc/packeteer/span.pcap
                local: [192.0.2.0/24, "2001:db8:1::/48"]
          YAML
          docker run --rm --network host --cap-add NET_RAW \
            -v /tmp/span.yaml:/etc/packeteer/config.yaml:ro packeteer:ci -check | grep -q "source span"
          docker run -d --name pkspan --network host --cap-add NET_RAW --cap-add NET_ADMIN \
            -v /tmp/span.yaml:/etc/packeteer/config.yaml:ro \
            -v "$PWD/internal/plugins/source/span/testdata/problems.pcap:/etc/packeteer/span.pcap:ro" packeteer:ci
          ok=0
          for _ in $(seq 1 15); do
            if docker logs pkspan 2>&1 | grep -q 'span problem prefix.*prefix=2001:db8:eeee::/48'; then ok=1; break; fi
            sleep 2
          done
          docker stop -t 15 pkspan
          docker logs pkspan 2>&1 | tee /tmp/pkspan.log
          test "$ok" = 1
          test "$(docker inspect -f '{{.State.ExitCode}}' pkspan)" = "0"
          grep -q 'span pcap replay done.*packets=552' /tmp/pkspan.log
          grep -q 'span problem prefix.*prefix=198.51.100.0/24.*reasons=retrans' /tmp/pkspan.log
          grep -q 'span problem prefix.*prefix=203.0.113.0/24' /tmp/pkspan.log
          grep -q 'msg=probe .*prefix=198.51.100.0/24.*prober=fixed' /tmp/pkspan.log
          grep -q "shutting down" /tmp/pkspan.log
      - name: config editor and wizard smoke test (#34; mounted single-file config, basic auth, observe)
        run: |
          mkdir -p /tmp/edit
          cat > /tmp/edit/config.yaml <<'YAML'
          mode: observe
          asn: 64512
          router_id: 192.0.2.10
          auth: {enabled: false}
          http:
            listen: "127.0.0.1:18084"
            config_editor: true
          providers:
            - name: lab-a
              source_ip: 127.0.0.1
              next_hop: 127.0.0.1
          probe: {interval: 2s, timeout: 500ms, packets: 3}
          probers:
            - type: fixed
              config:
                paths: [{provider: lab-a, rtt_ms: 10}]
          sources:
            - type: static
              config:
                targets: [{prefix: 198.51.100.0/24, host: 198.51.100.1}]
          YAML
          cp /tmp/edit/config.yaml /tmp/edit/original.yaml
          docker run -d --name pkedit --network host --cap-add NET_RAW --cap-add NET_ADMIN \
            -e PACKETEER_HTTP_USER=ops -e PACKETEER_HTTP_PASSWORD=lab-only-secret \
            -v /tmp/edit/config.yaml:/etc/packeteer/config.yaml packeteer:ci
          api() { curl -sS -u ops:lab-only-secret -H 'Content-Type: application/json' "$@"; }
          ok=0
          for _ in $(seq 1 15); do
            if api http://127.0.0.1:18084/api/config -o /tmp/edit/get.json; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          base=$(jq -r .sha256 /tmp/edit/get.json)
          test "$base" = "$(sha256sum /tmp/edit/original.yaml | cut -d' ' -f1)"
          # Invalid: refused, file untouched.
          code=$(jq -n --arg b "$base" '{yaml: "mode: observe\n", base: $b}' | api -o /tmp/edit/bad.json -w '%{http_code}' -X PUT --data-binary @- http://127.0.0.1:18084/api/config)
          test "$code" = 422
          cmp /tmp/edit/config.yaml /tmp/edit/original.yaml
          # No credentials: refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18084/api/config)" = 401
          # A valid edit is written into the bind-mounted file in place.
          sed 's/^asn: 64512$/asn: 64513\nhold_time: 20m/' /tmp/edit/original.yaml > /tmp/edit/next.yaml
          code=$(jq -Rs --arg b "$base" '{yaml: ., base: $b}' /tmp/edit/next.yaml | api -o /tmp/edit/put.json -w '%{http_code}' -X PUT --data-binary @- http://127.0.0.1:18084/api/config)
          cat /tmp/edit/put.json
          test "$code" = 200
          jq -e '.result.restart_required == true and (.result.changed | index("asn")) != null' /tmp/edit/put.json
          cmp /tmp/edit/config.yaml /tmp/edit/next.yaml
          # Round trip: the stock image loads what the editor wrote.
          docker run --rm -v /tmp/edit/config.yaml:/etc/packeteer/config.yaml:ro packeteer:ci -check | tee /tmp/edit/check.txt
          grep -q "http config_editor: on" /tmp/edit/check.txt
          # The wizard renders an observe config that the editor validates.
          # edge, prefix, and host are the wizard steps. neighbors and targets are not fields; unknown JSON is refused and the body has no mode.
          code=$(jq -n '{asn: 64512, router_id: "192.0.2.10", edge: "192.0.2.254", providers: [{name: "transit-a", source_ip: "192.0.2.11", next_hop: "192.0.2.1"}], prefix: "198.51.100.0/24", host: "198.51.100.1"}' \
            | api -o /tmp/edit/wizard.json -w '%{http_code}' -X POST --data-binary @- http://127.0.0.1:18084/api/config/wizard)
          test "$code" = 200
          jq -e '.mode == "observe"' /tmp/edit/wizard.json
          jq '{yaml: .yaml}' /tmp/edit/wizard.json | api -X POST --data-binary @- http://127.0.0.1:18084/api/config/validate | jq -e '.valid == true and .mode == "observe"'
          docker stop -t 15 pkedit
          docker logs pkedit 2>&1 | tee /tmp/pkedit.log
          test "$(docker inspect -f '{{.State.ExitCode}}' pkedit)" = "0"
          grep -q "config file written through the editor" /tmp/pkedit.log
      - name: anomaly detection smoke test (mounted config, observe, no rules)
        run: |
          cat > /tmp/anom.yaml <<'YAML'
          mode: observe
          asn: 64512
          router_id: 192.0.2.10
          auth: {enabled: false}
          http:
            listen: "127.0.0.1:18083"
          providers:
            - name: lab-a
              source_ip: 127.0.0.1
              next_hop: 127.0.0.1
          probe: {interval: 2s, timeout: 500ms, packets: 3}
          probers:
            - type: fixed
              config:
                paths: [{provider: lab-a, rtt_ms: 10}]
          sources:
            - type: flow
              config:
                listen: "127.0.0.1:12055"
          anomaly:
            interval: 2s
            detector:
              type: baseline
              config: {sensitivity: 4, warmup: 5}
          YAML
          docker run --rm -v /tmp/anom.yaml:/etc/packeteer/config.yaml:ro packeteer:ci -check | tee /tmp/anomcheck.txt
          grep -q "detector baseline" /tmp/anomcheck.txt
          grep -q "anomaly: detector=baseline interval=2s rules=0" /tmp/anomcheck.txt
          # Rules without threat mitigation are refused at startup.
          sed 's/^    config: {sensitivity: 4, warmup: 5}$/&\n  rules: [{name: x, prefixes: [198.51.100.0\/24], action: flowspec_drop}]/' /tmp/anom.yaml > /tmp/anom-bad.yaml
          grep -q "rules:" /tmp/anom-bad.yaml
          if docker run --rm -v /tmp/anom-bad.yaml:/etc/packeteer/config.yaml:ro packeteer:ci -check; then echo "expected refusal"; exit 1; fi
          docker run -d --name pkanom --network host --cap-add NET_RAW --cap-add NET_ADMIN \
            -e PACKETEER_CONFIG=/etc/packeteer/anom.yaml -v /tmp/anom.yaml:/etc/packeteer/anom.yaml:ro packeteer:ci
          ok=0
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18083/api/anomalies -o /tmp/anom.json && grep -q '"enabled":true' /tmp/anom.json \
              && grep -q '"detector":"baseline"' /tmp/anom.json && grep -q '"last_round":"2' /tmp/anom.json \
              && curl -fsS http://127.0.0.1:18083/metrics | grep -q '^packeteer_anomaly_baselines 0'; then ok=1; break; fi
            sleep 2
          done
          docker stop -t 15 pkanom
          docker logs pkanom 2>&1 | tee /tmp/pkanom.log
          test "$ok" = 1
          test "$(docker inspect -f '{{.State.ExitCode}}' pkanom)" = "0"
          grep -q "shutting down" /tmp/pkanom.log

      - name: quickstart guide, every command (#50; docs/quickstart.md against this image, observe)
        run: bash lab/e2e-docs.sh docs/quickstart.md packeteer:ci
      - name: troubleshooting guide examples (#50; docs/troubleshooting.md against this image)
        run: bash lab/e2e-docs.sh docs/troubleshooting.md packeteer:ci
      - name: upgrade e2e (#196; stock image, mounted config, bad signature and checksum, upgrade in the same container, rollback, observe)
        run: MODE=docker IMAGE=packeteer:ci bash lab/e2e-upgrade.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: FRR announce/withdraw lab
        run: bash lab/e2e.sh
      - name: FRR flap quarantine lab (oscillating latency withdraws after max_flips, native path while parked, cool-down release, SIGTERM)
        run: bash lab/e2e-flap.sh
      - name: FRR make-before-break lab (#386; provider move is one replacing UPDATE, one Packeteer path, no withdraw, flip-back withdraw seen, SIGTERM)
