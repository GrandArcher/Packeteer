          cat > /tmp/ui131.yaml <<'YAML'
          mode: observe
          asn: 64512
          router_id: 192.0.2.10
          auth: {enabled: false}
          http:
            listen: "127.0.0.1:18134"
            config_editor: true
          providers:
            - name: lab-a
              source_ip: 127.0.0.1
              next_hop: 192.0.2.1
          probe: {interval: 30s, timeout: 200ms, packets: 1}
