          # exist: the poll fails and the stored samples stay.
          mkdir -p /tmp/pkcommit
          go run ./lab/mkhistory -commit -o /tmp/pkcommit/packeteer.db
          cat > /tmp/ui174.yaml <<'YAML'
          mode: observe
          asn: 64512
          router_id: 192.0.2.10
          auth: {enabled: false}
          http:
            listen: "127.0.0.1:18174"
            config_editor: true
          providers:
            - name: lab-a
              source_ip: 127.0.0.1
              next_hop: 192.0.2.1
            - name: lab-b
              source_ip: 127.0.0.2
              next_hop: 192.0.2.2
            - name: lab-c
              source_ip: 127.0.0.3
              next_hop: 192.0.2.3
            - name: lab-d
              source_ip: 127.0.0.4
              next_hop: 192.0.2.4
              cc_disable: True
          storage:
            type: sqlite
          telemetry:
            - type: snmp
              config:
                hosts:
                  - name: edge
                    address: 127.0.0.1
                    port: 16161
                    version: 2c
                    community_env: PACKETEER_SNMP_COMMUNITY
                providers:
                  - {name: lab-a, host: edge, interface: ether1, commit_mbps: 100, billing_day: 1, percentile: separate}
                  - {name: lab-b, host: edge, interface: ether1, commit_mbps: 200, billing_day: 1, percentile: separate}
                  - {name: lab-c, host: edge, interface: ether3, commit_mbps: 50, billing_day: 1, percentile: Separate}
          YAML
          docker run -d --name pkui174 --network host --cap-add NET_RAW --cap-add NET_ADMIN \
            -e PACKETEER_HTTP_USER=lab -e PACKETEER_HTTP_PASSWORD=lab-only -e PACKETEER_SNMP_COMMUNITY=lab-only-community \
            -v /tmp/ui174.yaml:/etc/packeteer/config.yaml:ro -v /tmp/pkcommit:/var/lib/packeteer packeteer:ci
          proxy=""
          cleanup() {
            if [ -n "$proxy" ]; then kill "$proxy" 2>/dev/null || true; fi
            docker stop -t 15 pkui174 >/dev/null || true
            docker logs pkui174 2>&1 | tail -n 40
            code="$(docker inspect -f '{{.State.ExitCode}}' pkui174)"
            docker rm pkui174 >/dev/null || true
            test "$code" = "0"
          }
          trap cleanup EXIT
          auth=(-u lab:lab-only)
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "${auth[@]}" "$base/readyz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          # 1, 7, and 30 days from the persisted samples: every range has
          # points, lab-a is over its commit, lab-b under, lab-c has no points,
          # and the moves are the three recommended and the one announced.
          # Any other range is refused.
          curl -fsS "${auth[@]}" "$base/api/commit?days=30" | tee /tmp/commit174.json
          jq -e '.mode == "observe" and .samples_stored and .moves_recorded and ([.providers[].provider] == ["lab-a","lab-b","lab-c"])
            and (.providers[0].points | length > 340) and (.providers[0].billable_mbps > .providers[0].commit_mbps)
            and (.providers[1].billable_mbps < .providers[1].commit_mbps) and (.providers[2].points | length == 0)
            and ([.providers[0].moves[] | select(.announced)] | length == 1)
            and ([.providers[0].moves[] | select(.announced | not) | .prefixes] | add == 3)
            and ([.providers[1].moves[] | select(.direction == "onto")] | length == 3)' /tmp/commit174.json
          curl -fsS "${auth[@]}" "$base/api/commit?days=7" | jq -e '.step_seconds == 1800 and (.providers[0].points | length >= 330 and length <= 340) and (.providers[0].moves | length == 3)'
          curl -fsS "${auth[@]}" "$base/api/commit?days=1" | jq -e '.step_seconds == 300 and (.providers[0].points | length >= 280 and length <= 290) and (.providers[0].moves | length == 0)'
          test "$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$base/api/commit?days=2")" = 400
          go build -o /tmp/uiproxy ./lab/uiproxy
          /tmp/uiproxy -listen 127.0.0.1:18175 -upstream "$base" -user lab -password lab-only >/tmp/uiproxy174.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18175/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18175/healthz >/dev/null
          # The graph is drawn per provider: samples, running 95th, commit
          # line, and the moves worded Recommended in observe and Announced
          # only for the record an inject run made. lab-c has no samples.
          bash lab/ui-smoke.sh http://127.0.0.1:18175/commit.html 'class="ts-chart usage-chart"' 'ts-line usage-sample' 'ts-line usage-p95' \
            'class="usage-commit"' 'lab-a: billable 95th' 'Thick: running 95th of the billing period' 'Data (3' \
            'Recommended: 2 prefixes off lab-a toward lab-b' 'Recommended: 1 prefix off lab-a toward lab-b' 'Announced: 1 prefix off lab-a toward lab-b' \
            'Recommended: 2 prefixes onto lab-b from lab-a' 'No stored samples for lab-c in this range.' \
            'mode-observe' 'It announces nothing.' --absent 'Cannot reach' 'mode-inject' 'No provider has a telemetry binding'
          bash lab/ui-smoke.sh 'http://127.0.0.1:18175/commit.html?days=1' 'class="ts-chart usage-chart"' 'Data (2' 'Commit control moved no traffic for lab-a in this range.' \
            'No stored samples for lab-c in this range.' 'It announces nothing.' --absent 'Cannot reach' 'Announced:' 'Recommended:'
          bash lab/ui-smoke.sh 'http://127.0.0.1:18175/commit.html?days=30' 'class="ts-chart usage-chart"' 'Data (3' 'Announced: 1 prefix off lab-a toward lab-b' \
            'Recommended: 2 prefixes off lab-a toward lab-b' 'It announces nothing.' --absent 'Cannot reach'
          # The same graph as a dashboard widget (#182), with its own time window.
          curl -fsS "${auth[@]}" -X PUT -H 'Content-Type: application/json' \
            -d '{"widgets":[{"type":"commit","days":30,"w":12,"h":4}]}' "$base/api/dashboards/usage" >/dev/null
          bash lab/ui-smoke.sh http://127.0.0.1:18175/dashboards.html 'class="card widget w-12 h-4"' 'class="ts-chart usage-chart"' 'lab-a: billable 95th' \
            'Announced: 1 prefix off lab-a toward lab-b' 'No stored samples for lab-c in this range.' 'It announces nothing.' --absent 'Cannot reach' 'No provider has a telemetry binding'
          kill "$proxy"
          # Headless Chrome cannot click, so uiproxy adds a driver to
          # /settings.html. It walks the Commit setup: the commit scorer, a
          # community typed where a variable name goes (refused in the page),
          # a new SNMP host, a commit and binding on lab-d, a provider renamed after
          # its commit is ticked, a group. lab-c has percentile: Separate and lab-d
          # cc_disable: True, which the form must read as the loader does. Apply
          # writes the YAML text and the editor validates it with the same
          # checks as a start. The file is mounted read-only and not saved.
          /tmp/uiproxy -listen 127.0.0.1:18176 -upstream "$base" -user lab -password lab-only \
            -fixtures lab/ui-fixtures/commit >/tmp/uiproxy174d.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18176/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18176/healthz >/dev/null
          bash lab/ui-smoke.sh http://127.0.0.1:18176/settings.html 'mode-observe' 'It announces nothing.' \
            'start: 4 providers | scorer weighted' \
            'balance shown: true | precedence shown: false' \
            'refused: SNMP host edge2: enter the name of the environment variable that holds the community (letters, digits, underscore), not the community itself. | step 2 shown: true' \
            'Scorer: commit (was weighted). | Balance in a group: equal. | New SNMP host edge2 at 192.0.2.253, version 2c, community read from the environment variable PACKETEER_SNMP_COMMUNITY.' \
            'case: lab-c percentile separate | lab-d cc_disable true' \
            'renamed: Provider lab-y: enter a commit greater than zero (Mbps). | Provider lab-y: enter the interface name. | step 2 shown: true | lab-y tracked: true' \
            'lab-d: commit 300 Mbps on edge2 ether2, billing day 5, greater_separate; group pair; precedence 200; left out of commit control.' \
            'yaml: commit scorer true | balance equal true | host edge2 true | env name true | commit 300 true | interface ether2 true | billing day 5 true | precedence 200 true | group pair true | cc_disable kept true | mode observe true | no community true' \
            'validated: Valid · mode observe · changed: providers, scorer, telemetry · restart required' \
            --absent 'Cannot reach' 'mode-inject' 'lab-only-community' 's3cret-community'
      - name: UI reports smoke (#178; range, filters, sorting, CSV and XLSX from seeded history, observe)
        run: |
          set -euo pipefail
          base=http://127.0.0.1:18207
          mkdir -p /tmp/pkrep
          go run ./lab/mkhistory -o /tmp/pkrep/packeteer.db
          cat > /tmp/ui178.yaml <<'YAML'
          mode: observe
          asn: 64512
          router_id: 192.0.2.10
          auth: {enabled: false}
          http:
            listen: "127.0.0.1:18207"
          providers:
            - name: lab-a
              source_ip: 127.0.0.1
              next_hop: 192.0.2.1
            - name: lab-b
              source_ip: 127.0.0.2
              next_hop: 192.0.2.2
          storage:
            type: sqlite
          YAML
          docker run -d --name pkui178 --network host --cap-add NET_RAW --cap-add NET_ADMIN \
            -e PACKETEER_HTTP_USER=lab -e PACKETEER_HTTP_PASSWORD=lab-only \
            -v /tmp/ui178.yaml:/etc/packeteer/config.yaml:ro -v /tmp/pkrep:/var/lib/packeteer packeteer:ci
          proxy=""
          cleanup() {
            if [ -n "$proxy" ]; then kill "$proxy" 2>/dev/null || true; fi
            docker stop -t 15 pkui178 >/dev/null || true
            docker logs pkui178 2>&1 | tail -n 40
            code="$(docker inspect -f '{{.State.ExitCode}}' pkui178)"
            docker rm pkui178 >/dev/null || true
            test "$code" = "0"
          }
          trap cleanup EXIT
          auth=(-u lab:lab-only)
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "${auth[@]}" "$base/healthz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          rep() { curl -fsS "${auth[@]}" "$base/api/reports/$1"; }
          code() { curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$base/api/reports/$1"; }
          # The seed has three improvements: two performance (198.51.100.0/24,
          # 203.0.113.0/24) and one cost (192.0.2.0/24), lab-a to lab-b.
          rep 'improvements?days=30' | jq -e '.total == 3 and (.rows | length) == 3 and (.columns | map(.key) | index("hours")) != null'
          rep 'improvements?days=30&cause=cost' | jq -e '.total == 1 and .rows[0].prefix == "192.0.2.0/24"'
          rep 'improvements?days=30&provider=lab-a&ip_version=4&sort=prefix&order=desc' | jq -e '[.rows[].prefix] == ["203.0.113.0/24", "198.51.100.0/24", "192.0.2.0/24"]'
          rep 'improvements?days=30&ip_version=6' | jq -e '.total == 0 and (.rows | length) == 0'
          rep 'improvements?days=30&sort=prefix&limit=1' | jq -e '.total == 3 and (.rows | length) == 1 and .rows[0].prefix == "192.0.2.0/24"'
          rep 'providers?days=30&provider=lab-b' | jq -e '(.rows | length) == 1 and .rows[0].provider == "lab-b"'
          # Probes per destination ASN per day (#203): the seed has AS64496 on
          # two prefixes (400 probes a day) and AS64497 on one (200), five days.
          rep 'probe_asns?days=30' | jq -e '.total == 10 and (.rows | length) == 10 and .rows[0].origin_asn == 64496 and .rows[0].prefixes == 2 and .rows[0].probes == 400 and .rows[1].origin_asn == 64497 and .rows[1].probes == 200'
          rep 'probe_asns?days=30&asn=AS64497' | jq -e '.total == 5 and ([.rows[].probes] | unique) == [200]'
          rep 'probe_asns?days=30&format=csv' | head -n 1 | grep -qx 'day,origin_asn,prefixes,probes,failed'
          test "$(code 'probe_asns?cause=cost')" = 400
          # Unknown parameters, filters a report does not take, and bad values are refused.
          for q in 'improvements?colour=red' 'summary?cause=cost' 'timeseries?provider=lab-a' 'improvements?cause=nope' 'improvements?ip_version=5' \
            'improvements?sort=nope' 'improvements?order=desc' 'improvements?days=7&from=2026-01-01' 'improvements?format=pdf'; do
            test "$(code "$q")" = 400 || { echo "not refused: $q"; exit 1; }
          done
          # Old URLs keep working.
          for q in 'summary' 'summary?days=7' 'prefixes?days=30&sort=loss&limit=5' 'improvements?days=90&format=csv'; do
            test "$(code "$q")" = 200 || { echo "refused: $q"; exit 1; }
          done
          # CSV and XLSX of one filtered, sorted view hold the same rows in the same order.
          qs='days=30&provider=lab-b&sort=prefix&order=desc'
          rep "improvements?$qs&format=csv" > /tmp/rep178.csv
          rep "improvements?$qs&format=xlsx" > /tmp/rep178.xlsx
          unzip -p /tmp/rep178.xlsx xl/worksheets/sheet1.xml > /tmp/rep178.xml
          test "$(grep -o '<row r=' /tmp/rep178.xml | wc -l)" = "$(wc -l < /tmp/rep178.csv)"
          test "$(sed -n '2p' /tmp/rep178.csv | cut -d, -f1)" = 203.0.113.0/24
          grep -o '<c r="A[0-9]*" t="inlineStr"><is><t xml:space="preserve">[^<]*' /tmp/rep178.xml | sed 's/.*>//' | paste -sd, | grep -qx '203.0.113.0/24,198.51.100.0/24,192.0.2.0/24'
          curl -s -D - -o /dev/null "${auth[@]}" "$base/api/reports/summary?format=xlsx" | grep -i 'content-type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          go build -o /tmp/uiproxy ./lab/uiproxy
          /tmp/uiproxy -listen 127.0.0.1:18208 -upstream "$base" -user lab -password lab-only >/tmp/uiproxy178.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18208/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18208/healthz >/dev/null
          # The page reads its view from the URL: the catalog by category, the
          # filters this report takes, the sorted column, the row count, and
          # exports with the same query.
          bash lab/ui-smoke.sh 'http://127.0.0.1:18208/reports.html?report=improvements&days=30&provider=lab-b&sort=hours&order=desc' \
            'mode-observe' 'It announces nothing.' '>Improvements</h3>' '>Protection</h3>' 'aria-current="page"' 'id="rf-cause-label"' \
            'aria-sort="descending"' 'Active (h) ▼' 'Showing 3 of 3 rows' 'href="/prefix/198.51.100.0/24"' \
            'provider=lab-b&amp;sort=hours&amp;order=desc&amp;format=csv' 'provider=lab-b&amp;sort=hours&amp;order=desc&amp;format=xlsx' \
            --absent 'Cannot reach' 'mode-inject' 'History is off'
          bash lab/ui-smoke.sh 'http://127.0.0.1:18208/reports.html?report=improvements&days=30&cause=cost' 'Showing 1 of 1 rows' 'href="/prefix/192.0.2.0/24"' \
            --absent 'href="/prefix/198.51.100.0/24"' 'Cannot reach'
          bash lab/ui-smoke.sh 'http://127.0.0.1:18208/reports.html?report=summary&days=7' 'id="rf-provider-label"' 'id="rf-cause-label" hidden=""' 'Showing 1 of 1 rows' --absent 'Cannot reach' 'id="rf-provider-label" hidden=""'
          bash lab/ui-smoke.sh 'http://127.0.0.1:18208/reports.html?report=summary&cause=cost' 'the summary report has no cause filter' --absent 'Cannot reach' 'Showing'
          bash lab/ui-smoke.sh 'http://127.0.0.1:18208/reports.html?report=probe_asns&days=30' '>Probes by ASN<' 'Showing 10 of 10 rows' 'href="/prefixes.html?asn=64496"' \
            'href="/prefixes.html?asn=64497"' 'id="rf-cause-label" hidden=""' --absent 'Cannot reach' 'History is off'
          kill "$proxy"
          # Headless Chrome cannot click, so uiproxy adds a driver to
          # /reports.html. It sorts the Prefix column twice, filters by cause,
          # picks a custom range typed in local time, and adds the view to a
          # dashboard. Chrome runs in Asia/Kolkata (UTC+5:30): 08:30 typed is
          # sent as 03:00Z. The answers are the API's.
          /tmp/uiproxy -listen 127.0.0.1:18209 -upstream "$base" -user lab -password lab-only \
            -fixtures lab/ui-fixtures/reports >/tmp/uiproxy178d.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18209/healthz >/dev/null 2>&1 && break
            sleep 0.2
