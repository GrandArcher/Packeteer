            - type: static
              config:
                targets: [{prefix: 198.51.100.0/24}]
            - type: flow
              config:
                listen: 127.0.0.1:12056
          mitigation:
            mode: observe
            allowlist: [203.0.113.0/24]
            max_rules: 5
          anomaly:
            detector:
              type: baseline
            rules:
              - name: udp-flood
                prefixes: [203.0.113.0/24]
                protocols: [udp]
                min_mbps: 100
                action: flowspec_drop
                ttl: 30m
          inbound:
            mode: suggest
            prefixes: [198.51.100.0/24]
            moderated: [performance]
            performance: {latency_ms: 50}
          probers:
            - type: fixed
              config:
                paths: [{provider: lab-a, rtt_ms: 12}]
          YAML
          docker run -d --name pkui131 --network host --cap-add NET_RAW --cap-add NET_ADMIN \
            -e PACKETEER_HTTP_USER=lab -e PACKETEER_HTTP_PASSWORD=lab-only \
            -v /tmp/ui131.yaml:/etc/packeteer/config.yaml:ro packeteer:ci
          proxy=""
          cleanup() {
            if [ -n "$proxy" ]; then kill "$proxy" 2>/dev/null || true; fi
            docker stop -t 15 pkui131 >/dev/null || true
            docker logs pkui131 2>&1 | tail -n 40
            code="$(docker inspect -f '{{.State.ExitCode}}' pkui131)"
            docker rm pkui131 >/dev/null || true
            test "$code" = "0"
          }
          trap cleanup EXIT
          auth=(-u lab:lab-only)
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "${auth[@]}" "$base/healthz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          # Add and remove a rule in observe through the calls the form
          # makes. The rule is held as a dry run and nothing is announced.
          curl -fsS "${auth[@]}" "$base/api/mitigations/candidates" | jq -e '.enabled == true and .allowlist == ["203.0.113.0/24"] and (.prefixes | length) == 0'
          curl -fsS "${auth[@]}" -H 'Content-Type: application/json' \
            -d '{"prefix":"203.0.113.0/24","action":"blackhole","ttl":"10m","reason":"ui smoke"}' "$base/api/mitigations" >/tmp/mit131.json
          jq -e '.announced == false and (.pending | test("dry run"))' /tmp/mit131.json
          curl -fsS "${auth[@]}" "$base/api/mitigations" | jq -e '.mitigation_mode == "observe" and .routes_held == 1 and .routes_announced == 0 and (.rules | length) == 1'
          curl -fsS "${auth[@]}" -X DELETE "$base/api/mitigations/$(jq -r .id /tmp/mit131.json)" -o /dev/null
          curl -fsS "${auth[@]}" "$base/api/mitigations" | jq -e '.routes_held == 0 and .routes_announced == 0 and (.rules | length) == 0'
          # The inbound and anomaly sections read from the file, an edit
          # merges back without touching the safety fields, and the start
          # checks accept it as observe with inject not enabled.
          yaml="$(curl -fsS "${auth[@]}" "$base/api/config" | jq -r .yaml)"
          jq -n --arg y "$yaml" '{yaml:$y}' | curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d @- "$base/api/config/form" >/tmp/form131.json
          jq -e '.form.inbound.enabled and .form.inbound.mode == "suggest" and .form.anomaly.enabled and .form.anomaly.mitigation_mode == "observe" and (.form.anomaly.rules | length) == 1' /tmp/form131.json
          jq '.form | .inbound.release_pct = "85"
            | .anomaly.rules += [{key:"",name:"rtbh",prefixes:["203.0.113.128/25"],protocols:[],min_mbps:"500",action:"blackhole",target:"",rate_mbps:"",ttl:""}]' /tmp/form131.json >/tmp/form131-edit.json
          jq -n --arg y "$yaml" --slurpfile f /tmp/form131-edit.json '{yaml:$y,apply:true,form:$f[0]}' \
            | curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d @- "$base/api/config/form" | jq -r .yaml >/tmp/merged131.yaml
          grep -q 'release_pct: 85' /tmp/merged131.yaml
          grep -q 'name: rtbh' /tmp/merged131.yaml
          grep -q 'mode: observe' /tmp/merged131.yaml
          ! grep -q 'announcer' /tmp/merged131.yaml
          jq -n --rawfile y /tmp/merged131.yaml '{yaml:$y}' | curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d @- "$base/api/config/validate" | tee /tmp/validate131.json
          jq -e '.valid == true and .mode == "observe" and .enables_inject == false' /tmp/validate131.json
          # The form cannot turn inbound inject on.
          jq '.form | .inbound.mode = "inject"' /tmp/form131.json >/tmp/form131-inject.json
          jq -n --arg y "$yaml" --slurpfile f /tmp/form131-inject.json '{yaml:$y,apply:true,form:$f[0]}' \
            | curl -sS "${auth[@]}" -H 'Content-Type: application/json' -d @- "$base/api/config/form" | jq -e '.error | test("inbound.mode inject")'
          go build -o /tmp/uiproxy ./lab/uiproxy
          /tmp/uiproxy -listen 127.0.0.1:18135 -upstream "$base" -user lab -password lab-only >/tmp/uiproxy131.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
