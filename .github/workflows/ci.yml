          PACKETEER_DOCS_CLEANUP: docker compose -f lab/docker-compose-walkthrough.yml down -v --remove-orphans; rm -rf lab/walkthrough
        run: bash lab/e2e-docs.sh docs/walkthrough.md

  failure-matrix:
    # Failure-mode matrix (#234): each injection surface against SIGKILL,
    # BGP session loss, missing measurements, a source going away, a reload
    # to observe, and a lowered cap, asserted on the simulated routers. A new
    # surface adds a file in lab/failure-matrix/ and an entry here;
    # lab/failure-matrix/matrix_test.go fails until it does.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        surface: [outbound, more-specific, inbound, mitigation, ha]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: failure-mode matrix, ${{ matrix.surface }}
        run: bash lab/e2e-failure-matrix.sh ${{ matrix.surface }}
      - name: a broken withdraw path must fail the matrix (#234; the reload to observe never reaches the controller)
        if: matrix.surface == 'outbound'
        run: |
          rc=0
          MATRIX_BREAK=reload-observe bash lab/e2e-failure-matrix.sh outbound reload-observe >broken.log 2>&1 || rc=$?
          tail -n 40 broken.log
          if [ "$rc" -eq 0 ]; then
            echo "the matrix passed with a broken withdraw path"
            exit 1
          fi
          grep -q 'Packeteer routes still on the router' broken.log

  onboarding:
    # Onboarding (#221). Lab only: documentation prefixes and ASNs, simulated
    # FRR and BIRD, the image built from this commit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: packeteer:ci
          build-args: VERSION=ci-${{ github.sha }}
      - name: onboarding lab (#221; one-command install in observe, blocking preflight checks with fixes, refused inject step, FRR and BIRD accept the router config, policy routing diff/apply/verify/clean)
        run: bash lab/e2e-onboarding.sh packeteer:ci
      - name: UI preflight smoke (#221; Run checks shows each check with its status and fix, router config for FRR, inject step hidden, no config write, observe)
        run: |
          cat > /tmp/ui221.yaml <<'YAML'
          mode: observe
          asn: 64512
          router_id: 192.0.2.10
          packeteer_community: "64512:666"
          providers:
            - {name: lab-a, source_ip: 127.0.0.1, next_hop: 192.0.2.1}
          bgp:
            neighbors:
              - address: 192.0.2.254
          announcer:
            type: gobgp
          http:
            config_editor: true
          YAML
          base=http://127.0.0.1:8080
          docker run -d --name pkpf221 --network host --cap-add NET_RAW --cap-add NET_ADMIN \
            -e PACKETEER_HTTP_USER=lab -e PACKETEER_HTTP_PASSWORD=lab-only \
            -v /tmp/ui221.yaml:/etc/packeteer/config.yaml:ro packeteer:ci
          proxy=""
          cleanup() {
            if [ -n "$proxy" ]; then kill "$proxy" 2>/dev/null || true; fi
            docker stop -t 15 pkpf221 >/dev/null || true
            docker logs pkpf221 2>&1 | tail -n 40
            docker rm pkpf221 >/dev/null || true
          }
          trap cleanup EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -u lab:lab-only "$base/healthz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          go build -o /tmp/uiproxy ./lab/uiproxy
          /tmp/uiproxy -listen 127.0.0.1:18221 -upstream "$base" -user lab -password lab-only \
            -fixtures lab/ui-fixtures/preflight >/tmp/uiproxy221.log 2>&1 &
          proxy=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18221/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18221/healthz >/dev/null
          bash lab/ui-smoke.sh http://127.0.0.1:18221/settings.html 'mode-observe' \
            'Preflight checks' 'Run checks' \
            'checks: bgp_session=Failed import_filter=Needs confirmation probe_egress=Warning timers=Failed withdrawal=Failed' \
            'inject step hidden: true' 'confirm button: Confirm' \
            'Injection stays off: 4 checks need attention.' 'Not established: 192.0.2.254.' \
            'What to do: ' 'neighbor 192.0.2.10 remote-as 64512' \
            'snippet: ! Packeteer on FRR. Generated for review: nothing is applied.' 'writes: 0' \
            --absent 'mode-inject' 'Cannot reach'

  chr:
    # MikroTik RouterOS CHR in QEMU (#52). The free CHR image is fetched
    # from MikroTik at run time (checksum pinned in lab/e2e-chr.sh) and runs
    # on the free license level; no license material, no GNS3, not cached.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils
      - name: CHR lab (RouterOS accepts and filters Packeteer's iBGP route, community + NO_EXPORT, no eBGP export, unlearned prefix never announced, flip-back, SIGTERM, frozen process, SIGKILL)
        run: bash lab/e2e-chr.sh

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: packeteer:ci
          build-args: VERSION=ci-${{ github.sha }}
      - name: load test (#51; stock image, mounted config, observe, full-table synthetic RIB, sustained IPFIX, churn, budgets in lab/soak/budgets.yaml)
        env:
          SOAK_OUT: load-result.json
        run: bash lab/soak.sh packeteer:ci pr
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-result
          path: load-result.json
          if-no-files-found: ignore

  load-multi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: packeteer:ci
          build-args: VERSION=ci-${{ github.sha }}
      - name: multi-session inject soak (#383; 2 sessions x 20,000 prefixes, inject inside the documentation allowlist, flaps, slow peer, outage and vip; profile multi-smoke)
        env:
