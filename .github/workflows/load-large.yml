name: load-large

# Large-table load test (#217): about 5 million paths, the `large` profile
# in lab/soak/budgets.yaml. Lab only: the stock image with a mounted observe
# config against lab/soak's simulated edge router. The peak is about 24 GiB,
# so it needs a runner with at least 32 GB of RAM. GitHub-hosted
# ubuntu-latest has 16 GB, so name the runner label in the repository
# variable LARGE_RUNNER (Settings, Secrets and variables, Actions,
# Variables). Without it the scheduled run is skipped. Not a pull request
# check and not part of the required checks.
on:
  schedule:
    - cron: "41 4 * * 3" # weekly, Wednesday 04:41 UTC
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label with at least 32 GB of RAM (default is the LARGE_RUNNER variable)
        default: ""

permissions:
  contents: read

jobs:
  load-large:
    if: ${{ inputs.runner != '' || vars.LARGE_RUNNER != '' }}
    runs-on: ${{ inputs.runner || vars.LARGE_RUNNER }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: packeteer:large
          build-args: VERSION=large-${{ github.sha }}
      - name: large table (budgets in lab/soak/budgets.yaml, profile large)
        env:
          SOAK_OUT: large-result.json
        run: bash lab/soak.sh packeteer:large large
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: large-result
          path: large-result.json
          if-no-files-found: ignore
