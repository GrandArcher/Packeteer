# Example only. Copy config.example.yaml to ./config.yaml and edit it.
# Keep mode: observe until you have read docs/THREAT_MODEL.md.
services:
  packeteer:
    image: ghcr.io/grandarcher/packeteer:edge
    container_name: packeteer
    # Host networking: probes must leave via each transit's source IP and the
    # iBGP session must reach the edge router.
    network_mode: host
    cap_add:
      - NET_RAW    # ICMP probes
      - NET_ADMIN  # binding probe sockets to per-provider sources
    volumes:
      - ./config.yaml:/etc/packeteer/config.yaml:ro
      - ./plugins:/etc/packeteer/plugins:ro
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
    restart: unless-stopped
