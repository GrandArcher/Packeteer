# Threat feed lab (#134) on the threat mitigation routers (#28): a
# simulated edge plus two simulated eBGP transits, and a static web server
# (feed, 192.0.2.30:8000) serving the list from FEED_DIR, which
# lab/e2e-threat-feed.sh rewrites. Documentation addresses (RFC 5737) and
# documentation/private ASNs only. The script reads the ops API at
# 192.0.2.10:8080 (lab-only basic auth below).
name: packeteer-e2e-threat-feed
x-frr: &frr
  image: quay.io/frrouting/frr:10.2.4
  privileged: true
  entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
services:
  edge:
    <<: *frr
    hostname: edge
    environment:
      FRR_EXPECT: "ip route 192.0.2.66/32 blackhole;route-map from-packeteer in;route-map to-transit-b out;address-family ipv4 flowspec"
    volumes:
      - ./frr-mit-edge:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
  transit-a:
    <<: *frr
    hostname: transit-a
    environment:
      FRR_EXPECT: "router bgp 64496;network 198.51.100.0/24"
    volumes:
      - ./frr-mit-transit-a:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.21
  transit-b:
    <<: *frr
    hostname: transit-b
    environment:
      FRR_EXPECT: "router bgp 64497;neighbor 192.0.2.254 remote-as 64512;address-family ipv4 flowspec"
    volumes:
      - ./frr-mit-transit-b:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.22
  feed:
    image: busybox:1.36
    command: ["httpd", "-f", "-v", "-p", "8000", "-h", "/www"]
    volumes:
      - ${FEED_DIR:?FEED_DIR is set by lab/e2e-threat-feed.sh}:/www:ro
    networks:
      lab:
        ipv4_address: 192.0.2.30
  packeteer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    depends_on:
      - edge
      - feed
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
      # Lab-only credentials.
      PACKETEER_HTTP_USER: lab
      PACKETEER_HTTP_PASSWORD: lab-only
    volumes:
      - ./packeteer-threat-feed.yaml:/etc/packeteer/config.yaml:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
