# Internet exchange lab (#27). A simulated edge with a transit on the lab
# LAN and three exchange members on a simulated peering LAN, plus a second
# iBGP router for the online reconfiguration step. Documentation addresses
# (RFC 5737) and documentation/private ASNs only. Brought up by
# lab/e2e-ix.sh, which sets PACKETEER_LAB_DIR to a directory holding
# config.yaml (rewritten before each SIGHUP) and state.yaml (re-read by the
# fixed prober).
name: packeteer-e2e-ix
x-frr: &frr
  image: quay.io/frrouting/frr:10.2.4
  privileged: true
  entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
services:
  edge:
    <<: *frr
    hostname: edge
    environment:
      FRR_EXPECT: "addpath-tx-all-paths;route-map from-packeteer in;neighbor 203.0.113.13 remote-as 64503"
    volumes:
      - ./frr-ix-edge:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
      ix:
        ipv4_address: 203.0.113.1
  transit-a:
    <<: *frr
    hostname: transit-a
    environment:
      FRR_EXPECT: "router bgp 64496;network 198.51.100.0/24"
    volumes:
      - ./frr-bmp-transit-a:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.21
  ix-peer-a:
    <<: *frr
    hostname: ix-peer-a
    environment:
      FRR_EXPECT: "router bgp 64501;network 198.51.100.0/24;route-map to-edge out"
    volumes:
      - ./frr-ix-peer-a:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      ix:
        ipv4_address: 203.0.113.11
  ix-peer-b:
    <<: *frr
    hostname: ix-peer-b
    environment:
      FRR_EXPECT: "router bgp 64502;network 198.51.100.128/25"
    volumes:
      - ./frr-ix-peer-b:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      ix:
        ipv4_address: 203.0.113.12
  ix-peer-c:
    <<: *frr
    hostname: ix-peer-c
    environment:
      FRR_EXPECT: "router bgp 64503;network 198.51.100.0/24"
    volumes:
      - ./frr-ix-peer-c:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      ix:
        ipv4_address: 203.0.113.13
  collector:
    <<: *frr
    hostname: collector
    environment:
      FRR_EXPECT: "router bgp 64512;route-map from-packeteer in"
    volumes:
      - ./frr-ix-collector:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.253
      ix:
        ipv4_address: 203.0.113.2
  packeteer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    depends_on:
      - edge
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PACKETEER_CONFIG: /etc/packeteer/lab/config.yaml
      PACKETEER_LOG_LEVEL: debug
    volumes:
      - ${PACKETEER_LAB_DIR}:/etc/packeteer/lab:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
  ix:
    driver: bridge
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.254
