! Simulated edge for the IX lab (#27). Documentation prefixes, private and
! documentation ASNs only. Packeteer is 192.0.2.10, this router is
! 192.0.2.254 on the lab LAN and 203.0.113.1 on the simulated peering LAN
! 203.0.113.0/24. transit-a (AS 64496) is 192.0.2.21; the exchange members
! are ix-peer-a (AS 64501, 203.0.113.11), ix-peer-b (AS 64502,
! 203.0.113.12), and ix-peer-c (AS 64503, 203.0.113.13).
!
! transit-a's path for 198.51.100.0/24 is the shortest, so it is native.
! ix-peer-a and ix-peer-c send it prepended (inactive paths); ix-peer-b
! sends only 198.51.100.128/25. addpath-tx-all-paths sends Packeteer every
! path, so it sees each member's path with that member's next hop.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
bgp community-list standard packeteer permit 64512:666
!
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
route-map deny-all deny 10
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 ! Graceful restart is left off (FRR's default). Do not enable it.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.21 remote-as 64496
 neighbor 192.0.2.21 description transit-a
 neighbor 192.0.2.21 advertisement-interval 0
 neighbor 203.0.113.11 remote-as 64501
 neighbor 203.0.113.11 description ix-peer-a
 neighbor 203.0.113.11 advertisement-interval 0
 neighbor 203.0.113.12 remote-as 64502
 neighbor 203.0.113.12 description ix-peer-b
 neighbor 203.0.113.12 advertisement-interval 0
 neighbor 203.0.113.13 remote-as 64503
 neighbor 203.0.113.13 description ix-peer-c
 neighbor 203.0.113.13 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.10 addpath-tx-all-paths
  neighbor 192.0.2.21 activate
  neighbor 192.0.2.21 route-map deny-all out
  neighbor 203.0.113.11 activate
  neighbor 203.0.113.11 route-map deny-all out
  neighbor 203.0.113.12 activate
  neighbor 203.0.113.12 route-map deny-all out
  neighbor 203.0.113.13 activate
  neighbor 203.0.113.13 route-map deny-all out
 exit-address-family
!
