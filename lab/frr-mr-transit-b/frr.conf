! Simulated transit-b for the multi-router lab (#27). Documentation ASN
! 64497, peered with edge-b only. It sends 198.51.100.0/24 prepended, so
! edge-b prefers transit-a's path through the route reflector.
frr version 10.2
frr defaults traditional
hostname transit-b
log stdout informational
!
route-map deny-all deny 10
!
route-map to-edge permit 10
 set as-path prepend 64497 64497
!
router bgp 64497
 bgp router-id 192.0.2.22
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.252 remote-as 64512
 neighbor 192.0.2.252 description edge-b
 neighbor 192.0.2.252 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.252 activate
  neighbor 192.0.2.252 route-map deny-all in
  neighbor 192.0.2.252 route-map to-edge out
 exit-address-family
!
