! Simulated transit-b for the threat mitigation lab (#28). Documentation
! ASN 64497. It only receives: lab/e2e-mitigation.sh reads here that no
! mitigation route, FlowSpec rule, or Packeteer community leaves the edge.
frr version 10.2
frr defaults traditional
hostname transit-b
log stdout informational
!
route-map deny-all deny 10
!
router bgp 64497
 bgp router-id 192.0.2.22
 no bgp ebgp-requires-policy
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge
 neighbor 192.0.2.254 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 route-map deny-all out
 exit-address-family
 !
 address-family ipv4 flowspec
  neighbor 192.0.2.254 activate
 exit-address-family
!
