# Lab only (lab/e2e-verify-outbound.sh, #305). Documentation prefix, private
# ASN. Three providers so an improvement can move from transit-b to
# transit-c, with steer verification on. The prefix carries 40 Mbps of flow
# volume and the usage file gives each provider's outbound rate.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 3s
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
  - name: transit-c
    source_ip: 192.0.2.13
    next_hop: 192.0.2.4
allowlist:
  prefixes:
    - 198.51.100.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
  workers: 2
  rate_limit_pps: 50
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
          mbps: 40
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/state.yaml
telemetry:
  - type: fixed
    config:
      file: /etc/packeteer/probes/usage.yaml
verify:
  enabled: true
  outbound_window: 10s
announcer:
  type: gobgp

# Lab only: no sign-in, so the e2e scripts can read the API (#328).
auth:
  enabled: false
