! Simulated transit-a for the multi-router lab (#27). Documentation ASN
! 64496, peered with edge-a only. It sends 198.51.100.0/24 with the shorter
! AS path, so it is the native path on both edges.
frr version 10.2
frr defaults traditional
hostname transit-a
log stdout informational
!
route-map deny-all deny 10
!
router bgp 64496
 bgp router-id 192.0.2.21
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.251 remote-as 64512
 neighbor 192.0.2.251 description edge-a
 neighbor 192.0.2.251 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.251 activate
  neighbor 192.0.2.251 route-map deny-all in
 exit-address-family
!
