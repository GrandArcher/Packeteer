# Internet VRF and partial-table lab (#206). A simulated edge whose transit
# sessions and Packeteer session are all in VRF internet, and two simulated
# transits, neither sending a full table. Documentation addresses (RFC 5737)
# and documentation/private ASNs only. Brought up by lab/e2e-vrf.sh, which
# sets PACKETEER_LAB_DIR to a directory containing state.yaml.
name: packeteer-e2e-vrf
x-frr: &frr
  image: quay.io/frrouting/frr:10.2.4
  privileged: true
  entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
services:
  edge:
    <<: *frr
    hostname: edge
    entrypoint: ["/bin/sh", "/lab/frr-vrf-start.sh"]
    environment:
      FRR_EXPECT: "router bgp 64512 vrf internet;route-map packeteer-in in;route-map ebgp-out out;ip route 198.51.100.0/24 blackhole"
    volumes:
      - ./frr-vrf:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
      - ./frr-vrf-start.sh:/lab/frr-vrf-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
  transit-a:
    <<: *frr
    hostname: transit-a
    environment:
      FRR_EXPECT: "router bgp 64496;network 198.51.100.0/24;default-originate"
    volumes:
      - ./frr-vrf-transit-a:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.21
  transit-b:
    <<: *frr
    hostname: transit-b
    environment:
      FRR_EXPECT: "router bgp 64497;default-originate"
    volumes:
      - ./frr-vrf-transit-b:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.22
  packeteer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    depends_on:
      - edge
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
    volumes:
      - ./packeteer-vrf.yaml:/etc/packeteer/config.yaml:ro
      - ${PACKETEER_LAB_DIR}:/etc/packeteer/probes:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
