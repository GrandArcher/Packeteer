! Simulated edge for the inbound MED lab (#303). Documentation prefixes,
! private and documentation ASNs only. Packeteer is 192.0.2.10. This router
! has two sessions to one transit (AS 64496): link 1 from 192.0.2.254 to
! 192.0.2.23, link 2 from 198.51.100.254 to 198.51.100.23.
!
! Contract with Packeteer (docs/inbound.md):
!  - A steer route carries 64512:666 (packeteer), 64512:667 (inbound
!    marker), the catalog communities, and no-export.
!  - Import: only marker routes lose no-export and win (weight).
!  - Export: 64512:1301 sets MED 100 on link 1 only and 64512:1302 on link
!    2 only; every other route goes out with MED 0, so the transit prefers
!    the link without the signal. Packeteer's 64512:* communities never
!    leave the edge.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
ip route 203.0.113.0/24 blackhole
ip route 192.0.2.1/32 blackhole
ip route 192.0.2.2/32 blackhole
!
bgp community-list standard packeteer permit 64512:666
bgp community-list standard packeteer-inbound permit 64512:667
bgp community-list standard no-export permit no-export
bgp community-list standard steer-link1-med permit 64512:1301
bgp community-list standard steer-link2-med permit 64512:1302
! One strip list: FRR keeps only the last `set comm-list delete` in a
! route-map entry.
bgp community-list standard strip-to-transit permit 64512:666
bgp community-list standard strip-to-transit permit 64512:667
bgp community-list standard strip-to-transit permit 64512:1301
bgp community-list standard strip-to-transit permit 64512:1302
!
route-map to-packeteer permit 10
 set ip next-hop 192.0.2.1
!
route-map from-packeteer permit 5
 match community packeteer-inbound
 set comm-list no-export delete
 set weight 65535
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
route-map to-link-1 permit 10
 match community steer-link1-med
 set metric 100
 set comm-list strip-to-transit delete
route-map to-link-1 permit 20
 set metric 0
 set comm-list strip-to-transit delete
!
route-map to-link-2 permit 10
 match community steer-link2-med
 set metric 100
 set comm-list strip-to-transit delete
route-map to-link-2 permit 20
 set metric 0
 set comm-list strip-to-transit delete
!
route-map deny-all deny 10
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart stays off (FRR's default) on every session.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 ! lab/e2e-inbound-med.sh bounds the SIGKILL withdraw on this hold time.
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.23 remote-as 64496
 neighbor 192.0.2.23 description transit-m-link-1
 neighbor 192.0.2.23 advertisement-interval 0
 neighbor 198.51.100.23 remote-as 64496
 neighbor 198.51.100.23 description transit-m-link-2
 neighbor 198.51.100.23 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 soft-reconfiguration inbound
  neighbor 192.0.2.10 route-map to-packeteer out
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.23 activate
  neighbor 192.0.2.23 next-hop-self
  neighbor 192.0.2.23 send-community
  neighbor 192.0.2.23 route-map deny-all in
  neighbor 192.0.2.23 route-map to-link-1 out
  neighbor 198.51.100.23 activate
  neighbor 198.51.100.23 next-hop-self
  neighbor 198.51.100.23 send-community
  neighbor 198.51.100.23 route-map deny-all in
  neighbor 198.51.100.23 route-map to-link-2 out
 exit-address-family
!
