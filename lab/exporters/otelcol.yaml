# Sink for the otlp exporter test: an OpenTelemetry collector that accepts
# OTLP/HTTP and appends each request as one JSON line to a file per signal.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
exporters:
  file/traces:
    path: /out/traces.json
    flush_interval: 1s
  file/logs:
    path: /out/logs.json
    flush_interval: 1s
  file/metrics:
    path: /out/metrics.json
    flush_interval: 1s
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
