# Lab only (#305). Documentation prefixes, private and documentation ASNs.
# The inbound lab config with steer verification on: when transit-a's
# inbound rate does not fall after the steer, the steer is reverted and held
# off. lab/e2e-verify-inbound.sh rewrites the usage file to move the traffic
# or not.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
# Longer than the verification window, so a steer is not released first.
hold_time: 30s
improvement_ttl: 1h
# Outbound thresholds out of reach: the probes only feed the inbound
# performance trigger, and no outbound improvement is made.
thresholds:
  min_loss_delta_pct: 90
  min_rtt_delta_ms: 5000
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
allowlist:
  prefixes:
    - 203.0.113.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
# Probe targets for the performance trigger. The fixed prober sends no
# packets; it re-reads paths.yaml.
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
        - prefix: 192.0.2.128/25
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/paths.yaml
# Verification reads the latest inbound rate of each transit.
verify:
  enabled: true
  inbound_window: 10s
  backoff: 90s
  max_backoff: 90s
telemetry:
  - type: fixed
    config:
      file: /etc/packeteer/probes/usage.yaml
announcer:
  type: gobgp
inbound:
  mode: inject
  prefixes:
    - 203.0.113.0/24
  local_pref: 1
  release_pct: 90
  # transit-a steered when its mean RTT is 100 ms over transit-b's.
  performance:
    latency_ms: 100
    min_prefixes: 2
  # Lab-scale damping: confirm 4s, hold doubles per flap up to 60s.
  damping:
    confirm: 4s
    backoff: 2
    max_hold: 60s
  announcer:
    type: gobgp
    config:
      marker: "64512:667"
      providers:
        # The edge prepends 64512 twice toward transit-a on 64512:1102 and
        # passes transit-a's TE community 64496:3 to transit-a only.
        - provider: transit-a
          name: prepend-2
          prepend: 2
          communities: ["64512:1102", "64496:3"]
        # Selective announcement: on 64512:1209 the edge does not send the
        # prefix to transit-b at all.
        - provider: transit-b
          name: withhold
          withhold: true
          communities: ["64512:1209"]

# Lab only: no sign-in, so the e2e scripts can read the API (#328).
auth:
  enabled: false
