# Reordering lab (#224). No BGP: Packeteer in observe mode measures packet
# reordering per provider path with TWAMP-Light trains toward a reflector it
# controls, plus an ICMP estimate. transit-a is one clean link. transit-b
# reaches the reflector over a 2-way ECMP bundle whose second member gets a
# netem reorder qdisc from lab/e2e-reorder.sh. Documentation prefixes only
# (RFC 5737): 192.0.2.0/24 is the edge LAN, 198.51.100.0/24 the transit
# links, 203.0.113.9 the reflector's loopback.
name: packeteer-reorder
services:
  packeteer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    depends_on:
      - transit-a
      - transit-b
      - reflector
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
    # One probe source per provider, policy-routed to that provider
    # (docs/policy-routing.md), then the stock binary.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ip addr add 192.0.2.11/24 dev eth0 &&
        ip addr add 192.0.2.12/24 dev eth0 &&
        ip rule add from 192.0.2.11 table 101 &&
        ip route add default via 192.0.2.1 table 101 &&
        ip rule add from 192.0.2.12 table 102 &&
        ip route add default via 192.0.2.2 table 102 &&
        exec /usr/local/bin/packeteer
    volumes:
      - ./packeteer-reorder.yaml:/etc/packeteer/config.yaml:ro
    ports:
      - "127.0.0.1:18084:8080"
    networks:
      lab:
        ipv4_address: 192.0.2.10
  transit-a:
    image: alpine:3.22
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    command:
      - /bin/sh
      - -c
      - >-
        apk add --no-cache iproute2 >/dev/null &&
        ip route add 203.0.113.9/32 via 198.51.100.9 &&
        sleep infinity
    networks:
      lab:
        ipv4_address: 192.0.2.1
      far-a:
        ipv4_address: 198.51.100.1
  transit-b:
    image: alpine:3.22
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.fib_multipath_hash_policy: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    command:
      - /bin/sh
      - -c
      - >-
        apk add --no-cache iproute2 >/dev/null &&
        ip route add 203.0.113.9/32 nexthop via 198.51.100.73 nexthop via 198.51.100.137 &&
        sleep infinity
    networks:
      lab:
        ipv4_address: 192.0.2.2
      far-b1:
        ipv4_address: 198.51.100.65
      far-b2:
        ipv4_address: 198.51.100.129
  reflector:
    image: packeteer:e2e
    depends_on:
      - transit-a
      - transit-b
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    # Replies to each probe source go back through its own transit; the
    # transit-b return path is the clean member.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ip addr add 203.0.113.9/32 dev lo &&
        ip route add 192.0.2.11/32 via 198.51.100.1 &&
        ip route add 192.0.2.12/32 via 198.51.100.65 &&
        exec /usr/local/bin/packeteer-reflector -listen 0.0.0.0:862
    networks:
      far-a:
        ipv4_address: 198.51.100.9
      far-b1:
        ipv4_address: 198.51.100.73
      far-b2:
        ipv4_address: 198.51.100.137
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
  far-a:
    driver: bridge
    ipam:
      config:
        - subnet: 198.51.100.0/26
          gateway: 198.51.100.62
  far-b1:
    driver: bridge
    ipam:
      config:
        - subnet: 198.51.100.64/26
          gateway: 198.51.100.126
  far-b2:
    driver: bridge
    ipam:
      config:
        - subnet: 198.51.100.128/26
          gateway: 198.51.100.190
