! Simulated edge-a for the multi-router lab (#27). Documentation prefixes,
! private and documentation ASNs only. Packeteer is 192.0.2.10, the route
! reflector is 192.0.2.250, edge-a is 192.0.2.251, edge-b is 192.0.2.252,
! transit-a (AS 64496) is 192.0.2.21, transit-b (AS 64497) is 192.0.2.22.
!
! This edge's only transit is transit-a. It is a client of the route reflector,
! which carries the other edge's paths and, in the route-reflector part of
! lab/e2e-multirouter.sh, Packeteer's routes. In the multi-edge part
! Packeteer peers with this edge directly.
frr version 10.2
frr defaults traditional
hostname edge-a
log stdout informational
!
bgp community-list standard packeteer permit 64512:666
!
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
route-map deny-all deny 10
!
router bgp 64512
 bgp router-id 192.0.2.251
 no bgp ebgp-requires-policy
 ! Graceful restart is left off (FRR's default). Do not enable it.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.250 remote-as 64512
 neighbor 192.0.2.250 description rr
 neighbor 192.0.2.250 timers 3 9
 neighbor 192.0.2.21 remote-as 64496
 neighbor 192.0.2.21 description transit-a
 neighbor 192.0.2.21 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.250 activate
  neighbor 192.0.2.21 activate
  neighbor 192.0.2.21 route-map deny-all out
 exit-address-family
!
