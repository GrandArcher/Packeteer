# Leak watch lab (#199). A simulated FRR edge, a simulated router outside the
# AS that streams BMP to Packeteer, and Packeteer. Documentation addresses
# (RFC 5737) and private ASNs only. Brought up by lab/e2e-leak-watch.sh.
name: packeteer-e2e-leak-watch
x-frr: &frr
  image: quay.io/frrouting/frr:10.2.4
  privileged: true
  entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
services:
  edge:
    <<: *frr
    hostname: edge
    environment:
      FRR_EXPECT: "router bgp 64512;network 198.51.100.0/24;route-map from-packeteer in;route-map to-ext out"
    volumes:
      - ./frr-leak-edge:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
  ext:
    <<: *frr
    hostname: ext
    environment:
      FRR_EXPECT: "router bgp 64511;bmp targets packeteer;bmp connect 192.0.2.10 port 11020"
    volumes:
      - ./frr-leak-ext:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.30
  packeteer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    depends_on:
      - edge
      - ext
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
      # Lab-only credentials: clearing a leak refuses writes without basic auth.
      PACKETEER_HTTP_USER: lab
      PACKETEER_HTTP_PASSWORD: lab-only
    volumes:
      - ./packeteer-leak-watch.yaml:/etc/packeteer/config.yaml:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
