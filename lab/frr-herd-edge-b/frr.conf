! Simulated edge of member-b for the herd lab (#260, #659). Documentation
! prefixes and documentation ASNs only. Each member has its own AS, so the
! hub lists one entry per member. This router (AS 64497, 192.0.2.253) learns
! 192.0.2.128/26 (path "64501 64510") and 192.0.2.192/27 (path
! "64501 64511") from the upstream (AS 64501, 192.0.2.21) and sends them
! over iBGP, next hop unchanged, to member-b at 192.0.2.11. The member announces
! nothing: it runs in observe mode and the edge accepts no route from it.
frr version 10.2
frr defaults traditional
hostname edge-b
log stdout informational
!
route-map from-member deny 10
!
router bgp 64497
 bgp router-id 192.0.2.253
 no bgp ebgp-requires-policy
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor 192.0.2.11 remote-as 64497
 neighbor 192.0.2.11 description member-b
 neighbor 192.0.2.11 passive
 neighbor 192.0.2.11 timers 3 9
 neighbor 192.0.2.21 remote-as 64501
 neighbor 192.0.2.21 description upstream
 neighbor 192.0.2.21 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 192.0.2.11 activate
  neighbor 192.0.2.11 route-map from-member in
  neighbor 192.0.2.11 soft-reconfiguration inbound
  neighbor 192.0.2.21 activate
 exit-address-family
!
