! Simulated edge for the RPKI-invalid only path lab (#627). Documentation
! prefixes, private ASN 64512 and documentation ASNs only. Packeteer is
! 192.0.2.10 (iBGP, observe), transit-a (AS 64496) is 192.0.2.21.
!
! The edge does no route origin validation: it passes every route from
! transit-a to Packeteer unchanged, next hop included, so Packeteer sees
! the invalid routes and validates them against the lab's Routinator.
! Nothing from Packeteer is filtered, so lab/e2e-only-invalid.sh can see
! any route Packeteer sends (it must send none).
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
route-map deny-all deny 10
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.21 remote-as 64496
 neighbor 192.0.2.21 description transit-a
 neighbor 192.0.2.21 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 soft-reconfiguration inbound
  neighbor 192.0.2.21 activate
  neighbor 192.0.2.21 route-map deny-all out
 exit-address-family
!
