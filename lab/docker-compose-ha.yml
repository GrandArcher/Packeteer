# Active/standby lab (#31). One FRR edge and two Packeteer instances of an
# HA pair that share a lease on one volume. Documentation addresses (RFC
# 5737) and a private ASN only. Brought up by lab/e2e-ha.sh, which sets
# PACKETEER_LAB_DIR to a directory containing state.yaml (the fixed prober
# re-reads that file).
name: packeteer-e2e-ha
x-packeteer: &packeteer
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      VERSION: e2e
  image: packeteer:e2e
  depends_on:
    - edge
  cap_add:
    - NET_RAW
    - NET_ADMIN
    - NET_BIND_SERVICE
  environment:
    PACKETEER_CONFIG: /etc/packeteer/config.yaml
    PACKETEER_LOG_LEVEL: debug
services:
  edge:
    image: quay.io/frrouting/frr:10.2.4
    hostname: edge
    privileged: true
    entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
    environment:
      FRR_EXPECT: "router bgp 64512;network 198.51.100.0/24;neighbor 192.0.2.20 route-map from-packeteer in"
    volumes:
      - ./frr-ha:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
  packeteer-a:
    <<: *packeteer
    volumes:
      - ./packeteer-ha-a.yaml:/etc/packeteer/config.yaml:ro
      - ${PACKETEER_LAB_DIR}:/etc/packeteer/probes:ro
      - ha:/var/lib/packeteer/ha
      - data-a:/var/lib/packeteer/data
    networks:
      lab:
        ipv4_address: 192.0.2.10
  packeteer-b:
    <<: *packeteer
    volumes:
      - ./packeteer-ha-b.yaml:/etc/packeteer/config.yaml:ro
      - ${PACKETEER_LAB_DIR}:/etc/packeteer/probes:ro
      - ha:/var/lib/packeteer/ha
      - data-b:/var/lib/packeteer/data
    networks:
      lab:
        ipv4_address: 192.0.2.20
volumes:
  ha: {}
  data-a: {}
  data-b: {}
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
