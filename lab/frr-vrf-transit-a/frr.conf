! Simulated transit-a for the VRF lab (#206). Documentation ASN 64496. A
! partial table: one prefix and a default route, never a full table.
frr version 10.2
frr defaults traditional
hostname transit-a
log stdout informational
!
route-map deny-all deny 10
!
router bgp 64496
 bgp router-id 192.0.2.21
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge
 neighbor 192.0.2.254 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 default-originate
  neighbor 192.0.2.254 route-map deny-all in
 exit-address-family
!
