! Simulated router outside the AS for the leak watch lab (#199). Documentation
! ASN 64511 only. It peers with the edge (AS 64512, 192.0.2.254), sends it
! nothing, and streams what it receives (post-policy Adj-RIB-In) to
! Packeteer's leak source over BMP (192.0.2.10:11020). What this router
! holds is what the outside sees of the edge.
frr version 10.2
frr defaults traditional
hostname ext
log stdout informational
!
route-map deny-all deny 10
!
router bgp 64511
 bgp router-id 192.0.2.30
 no bgp ebgp-requires-policy
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge
 neighbor 192.0.2.254 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 soft-reconfiguration inbound
  neighbor 192.0.2.254 route-map deny-all out
 exit-address-family
 !
 bmp targets packeteer
  bmp monitor ipv4 unicast post-policy
  bmp connect 192.0.2.10 port 11020 min-retry 1000 max-retry 2000
 exit
!
service integrated-vtysh-config
