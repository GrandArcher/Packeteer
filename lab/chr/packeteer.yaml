# Lab only (lab/e2e-chr.sh, #52). Documentation prefixes, private ASN.
# The fixed prober does not send packets; lab/e2e-chr.sh rewrites the
# probe file to steer and to flip back.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5s
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
http:
  listen: "127.0.0.1:18090"
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
# 203.0.113.0/24 is allowlisted and probed, but the CHR rejects the only
# path it has (no Packeteer community from the untagged speaker), so it is
# never in Packeteer's learned RIB and must never be announced.
allowlist:
  prefixes:
    - 198.51.100.0/24
    - 203.0.113.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.254
      description: chr-edge
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
        - prefix: 203.0.113.0/24
          host: 203.0.113.1
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/state.yaml
announcer:
  type: gobgp
