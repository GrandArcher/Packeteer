# Lab only (#206). Documentation prefixes, private and documentation ASNs.
# The edge (lab/frr-vrf/frr.conf) holds this session, both transit
# sessions, and every route inside its internet VRF. No provider sends a
# full table: transit-a sends 198.51.100.0/24 and a default route,
# transit-b a default route only. lab/e2e-vrf.sh checks that the learned
# prefix is steered inside the VRF, that the default route and a prefix
# only the default route covers stay unsteered, and the withdraws.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5m
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.21
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.22
allowlist:
  prefixes:
    - 198.51.100.0/24
    - 203.0.113.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge (VRF internet)
# 203.0.113.0/24 is covered only by the default route, and 0.0.0.0/0 is
# the default route itself: both are measured and never steered.
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
        - prefix: 203.0.113.0/24
          host: 203.0.113.1
        - prefix: 0.0.0.0/0
          host: 192.0.2.200
# transit-b is always the faster path.
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/state.yaml
announcer:
  type: gobgp

# Lab only: no sign-in, so the e2e scripts can read the API (#328).
auth:
  enabled: false
