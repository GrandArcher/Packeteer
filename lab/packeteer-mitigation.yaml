# Lab only (#28). Documentation prefixes, private and documentation ASNs.
# Threat mitigation is what announces: lab/e2e-mitigation.sh adds RTBH and
# redirect rules for 198.51.100.0/24 (learned from transit-a through the
# edge) through the ops API. Outbound thresholds are out of reach, so no
# outbound improvement is made.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5s
thresholds:
  min_loss_delta_pct: 90
  min_rtt_delta_ms: 5000
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.21
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.22
allowlist:
  prefixes:
    - 198.51.100.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
# The lab network is private to the job; the script reaches the API from
# the host. Writes need the basic auth set in the compose file.
http:
  listen: 0.0.0.0:8080
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
probers:
  - type: fixed
    config:
      paths:
        - provider: transit-a
          rtt_ms: 10
        - provider: transit-b
          rtt_ms: 10
announcer:
  type: gobgp
mitigation:
  mode: inject
  # 198.51.100.0/24 is learned; 198.51.100.128/25 is allowlisted but never
  # learned, so a rule for it must wait forever.
  allowlist:
    - 198.51.100.0/24
  max_rules: 2
  default_ttl: 10m
  max_ttl: 1h
  announcer:
    type: gobgp
    config:
      marker: "64512:668"
      blackhole:
        next_hop: 192.0.2.66
      redirect:
        - name: scrubber
          next_hop: 192.0.2.77
          communities: ["64512:777"]
