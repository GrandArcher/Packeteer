! Simulated edge for the Packeteer lab. Documentation prefix, private ASN.
! Packeteer is 192.0.2.10. This router is 192.0.2.254.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
! Native exit for 198.51.100.0/24 is next hop 192.0.2.1 (transit-a).
! Blackhole routes keep the BGP next hops resolvable inside the lab.
ip route 198.51.100.0/24 blackhole
ip route 192.0.2.1/32 blackhole
ip route 192.0.2.2/32 blackhole
!
bgp community-list standard packeteer permit 64512:666
!
route-map to-packeteer permit 10
 set ip next-hop 192.0.2.1
!
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart is left off (FRR's default). Do not enable it: Packeteer
 ! never advertises the capability, and routes must disappear with the session.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 ! Hold time 9s wins against Packeteer's 90s proposal. lab/e2e.sh bounds
 ! the SIGKILL withdraw on this value. Keep it in 3-30s.
 neighbor 192.0.2.10 timers 3 9
 !
 address-family ipv4 unicast
  ! FRR gives a network statement weight 32768, ahead of local preference,
  ! so this route stays best and FRR keeps advertising it to Packeteer.
  ! lab/e2e.sh first removes it (a real withdraw) and later sets the same
  ! weight on Packeteer's routes so local-pref 250 wins, which is what an
  ! eBGP-learned path (weight 0, or no weight on MikroTik) does.
  network 198.51.100.0/24
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 soft-reconfiguration inbound
  neighbor 192.0.2.10 route-map to-packeteer out
  neighbor 192.0.2.10 route-map from-packeteer in
 exit-address-family
!
