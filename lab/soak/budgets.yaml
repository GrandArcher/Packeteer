# Load and soak budgets (#51). lab/soak reads a profile, generates the
# workload, and fails when a measured figure is over its budget. A budget of
# 0 (or left out) is reported but not checked. docs/performance.md explains
# each figure and lists the last measured values.
#
# Lab only: documentation prefixes (192.0.2.0/24, 198.51.100.0/24,
# 203.0.113.0/24, 2001:db8::/32) and documentation ASNs, observe mode.
#
# Budgets are set for a GitHub-hosted ubuntu-latest runner (4 vCPU, 16 GB)
# with headroom over what that runner measures. Raise one only with the
# reason in the PR; a regression that needs a higher budget is a finding.
#
# Learn time and the three RSS figures grow with the table, so they are
# written per million prefixes (#217): the limit is the number times the
# profile's prefixes / 1,000,000. The `pr` values below equal the old flat
# limits at 1,250,000 prefixes (90 s, 6144, 384, and 192 MiB); nothing was
# raised. The `large` profile reuses the same per-million numbers, so it is
# a test of the scaling model: if 5M paths cost more per prefix than 1.25M
# did, that run fails and the miss is the finding.
profiles:
  # Quick local try (a minute, a small table). Report only.
  smoke:
    prefixes: 20000
    duration: 1m
    warmup: 20s
    sample: 2s
    flow_rate: 5000
    flow_hot: 2000
    flow_top_n: 500
    static_targets: 200
    churn: 600
    budgets: {}

  # Every pull request and push to main (CI job `load`).
  pr:
    prefixes: 1250000 # about a 2026 IPv4 + IPv6 full table
    duration: 10m
    warmup: 3m
    sample: 5s
    flow_rate: 20000 # IPFIX records per second
    flow_hot: 5000
    flow_top_n: 2000
    static_targets: 1000
    churn: 6000 # prefixes withdrawn and re-announced per minute
    # rss_growth_mb_per_mprefix (307.2; 384 MiB at this size) is the median
    # RSS over the second half after warmup minus the median during
    # warmup (see docs/performance.md). The nine
    # ubuntu-latest pr runs through 2026-10-01 were at most 146 MiB. The
    # old tenth-of-a-window median read a scavenger valley on Actions run
    # 36902639588 as 342. Same-day green main runs on 2026-10-07 measured
    # 0, 176, and 191. Actions run 37698413398 measured 258 (warmup median
    # 4590, second-half median 4849) while end RSS and peak sat with those
    # runs and RSS fell from 4966 to 4827. 384 is that sample plus
    # headroom. A second half 400 MiB above warmup still fails.
    #
    # rss_slope_mb_per_mprefix (#112; 153.6, 192 MiB at this size) is how
    # far RSS is still climbing at the end of the run: the smaller of the Theil-Sen slope over the last third
    # times that third, and the last-sixth median minus the middle-third
    # median (lab/soak/budget.go riseLastThird). A heap still growing when
    # the run ends fails even when growth is under budget. Three green
    # runs on 2026-10-10 (Actions 38060328414, 38059199721, 38058626210)
    # read 0, 0, and 103 MiB: the collector's sawtooth, not a leak. 192 is
    # about twice the worst of those and half the growth budget.
    budgets:
      learn_seconds_per_mprefix: 72 # 90 s at 1.25M
      rss_peak_mb_per_mprefix: 4915.2 # 6144 MiB at 1.25M, about 5 KiB a prefix
      rss_growth_mb_per_mprefix: 307.2
      rss_slope_mb_per_mprefix: 153.6
      cpu_avg_cores: 2.0
      threads: 64
      udp_drop_pct: 5
      api_p99_ms: 1500
      reconverge_seconds: 30
      shutdown_seconds: 20
      min_measured: 2500
      # Active prefixes per hour (#125): packeteer_probe_prefix_commits
      # after warmup, scaled to one hour. A prefix counts once per round
      # that stored it. Steady state on this profile is about 3,000
      # targets every 30s, 360,000 an hour. 180,000 is half of that, and
      # it is also under 2,500 targets at two rounds a minute.
      min_active_per_hour: 180000
      # Passive prefixes (#125): last packeteer_flow_prefixes_tracked.
      # Half of 20,000 records/s over 1.25M prefixes for a 5-minute
      # window is on the order of a million distinct prefixes. The exact
      # cells still stop at 20,000. 50,000 is past that cap, with room
      # for the sketch's error.
      min_passive_tracked: 50000

  # Opt-in (#103). Not the `load` job and not soak.yml. A human passes
  # the name: `bash lab/soak.sh IMAGE routes3m`. Same workload as `pr`
  # except the table is 3 million prefixes, with the `pr` per-million
  # budgets (#217), so it needs about 15 GiB of RAM at peak: not a
  # 16 GB hosted runner. Nothing has measured it. A miss is read against
  # the scaling model in docs/performance.md, not by raising a number.
  routes3m:
    prefixes: 3000000
    duration: 10m
    warmup: 3m
    sample: 5s
    flow_rate: 20000
    flow_hot: 5000
    flow_top_n: 2000
    static_targets: 1000
    churn: 6000
    budgets:
      learn_seconds_per_mprefix: 72
      rss_peak_mb_per_mprefix: 4915.2
      rss_growth_mb_per_mprefix: 307.2
      rss_slope_mb_per_mprefix: 153.6

  # Large table (#217): about 5 million paths, the size of several full
  # tables plus peering. Weekly in .github/workflows/load-large.yml on a
  # runner with at least 32 GB of RAM (a repository variable names it; it
  # is skipped when none is set). Not the `load` job, not on pull
  # requests. The same observe workload as `pr` over a longer window,
  # because a collection cycle on a heap this size takes longer. The table
  # is one path per prefix: the harness plays one iBGP session, so
  # "paths" here is prefixes. Budgets are the `pr` per-million numbers
  # times 5: 360 s, 24 GiB peak, 1536 MiB growth, 768 MiB still rising.
  large:
    prefixes: 5000000
    duration: 20m
    warmup: 6m
    sample: 10s
    flow_rate: 20000
    flow_hot: 5000
    flow_top_n: 2000
    static_targets: 1000
    churn: 6000
    budgets:
      learn_seconds_per_mprefix: 72
      rss_peak_mb_per_mprefix: 4915.2
      rss_growth_mb_per_mprefix: 307.2
      rss_slope_mb_per_mprefix: 153.6
      cpu_avg_cores: 2.0
      threads: 64
      udp_drop_pct: 5
      api_p99_ms: 1500
      reconverge_seconds: 30
      shutdown_seconds: 20
      min_measured: 2500
      min_active_per_hour: 180000
      min_passive_tracked: 50000

  # Opt-in (#125). Not the `load` job and not soak.yml. A human passes
  # the name: `bash lab/soak.sh IMAGE rate`. A 20,000-prefix table at
  # the operator packet rate (100 per second). 375 pinned static targets
  # is one 30s round for two same-family providers and 4 packets:
  # 100 * 30 / (2 * 4). Flow top_n shares that budget, so a round may
  # store only the prefixes that finished; the next pass continues the
  # rest. Budgets stay empty: the run reports active prefixes per hour
  # and passive prefixes tracked and does not fail a number. Do not
  # point CI at this name. The `pr` profile is what checks those floors.
  rate:
    prefixes: 20000
    duration: 2m
    warmup: 30s
    sample: 2s
    flow_rate: 2000
    flow_hot: 500
    flow_top_n: 200
    static_targets: 375
    churn: 60
    rate_limit_pps: 100
    budgets: {}

  # Weekly scheduled workflow (.github/workflows/soak.yml): the same load
  # for 5h30m, the most a hosted job allows. Growth is what a leak shows.
  soak:
    prefixes: 1250000
    duration: 5h30m
    warmup: 15m
    sample: 30s
    flow_rate: 20000
    flow_hot: 5000
    flow_top_n: 2000
    static_targets: 1000
    churn: 6000
    budgets:
      learn_seconds_per_mprefix: 72
      rss_peak_mb_per_mprefix: 5324.8 # 6656 MiB at 1.25M
      rss_growth_mb_per_mprefix: 409.6 # 512 MiB at 1.25M
      # The last third is 110 minutes, so the collector's sawtooth is
      # small beside it. No soak run has measured this figure yet; a miss
      # is read against the logged RSS series before anything changes.
      rss_slope_mb_per_mprefix: 153.6
      cpu_avg_cores: 2.0
      threads: 64
      udp_drop_pct: 5
      api_p99_ms: 2000
      reconverge_seconds: 30
      shutdown_seconds: 20
      min_measured: 2500
      # Same floors as `pr` (#125). The weekly run is the same workload
      # held longer, so the per-hour rate and the window estimate match.
      min_active_per_hour: 180000
      min_passive_tracked: 50000

  # Multi-session inject soak (#383). The harness plays several edge
  # routers, each sending the whole table, so Packeteer holds one path per
  # session for every prefix. Packeteer runs in inject mode with an
  # allowlist of the documentation blocks; the outage and vip sources are
  # on; one session flaps on a timer (the router sends its table again when
  # Packeteer comes back) and the last session reads Packeteer's messages
  # slowly. The run fails on a broken rule (a route outside the table or
  # without packeteer_community and NO_EXPORT, more routes than
  # max_improvements, a fast session still holding a route a minute after
  # its prefix left every session, fast sessions that disagree at the end),
  # a session that drops without a flap, or a decide or probe loop gap over
  # loop_gap_seconds (three probe intervals). Withdraw latency, lock wait
  # and memory are reported; no budget is set for them until a run on the
  # target runner has measured them.
  #
  # A short local try: 20,000 prefixes on 2 sessions.
  multi-smoke:
    prefixes: 20000
    duration: 4m
    warmup: 1m
    sample: 2s
    flow_rate: 5000
    flow_hot: 2000
    flow_top_n: 500
    static_targets: 200
    churn: 600
    sessions: 2
    inject: 1000
    flap_every: 75s
    slow_peer_bps: 2048
    vip_targets: 200
    outage_targets: 8
    budgets:
      loop_gap_seconds: 90

  # 2 sessions of 1,000,000 prefixes. Weekly in load-multi.yml.
  multi2:
    prefixes: 1000000
    duration: 30m
    warmup: 10m
    sample: 10s
    flow_rate: 20000
    flow_hot: 5000
    flow_top_n: 2000
    static_targets: 1000
    churn: 6000
    sessions: 2
    inject: 1000
    flap_every: 5m
    slow_peer_bps: 2048
    vip_targets: 500
    outage_targets: 8
    budgets:
      loop_gap_seconds: 90

  # 4 sessions of 1,000,000 prefixes: 4 million paths. Weekly in
  # load-multi.yml on the LARGE_RUNNER runner only.
  multi4:
    prefixes: 1000000
    duration: 30m
    warmup: 10m
    sample: 10s
    flow_rate: 20000
    flow_hot: 5000
    flow_top_n: 2000
    static_targets: 1000
    churn: 6000
    sessions: 4
    inject: 1000
    flap_every: 5m
    slow_peer_bps: 2048
    vip_targets: 500
    outage_targets: 8
    budgets:
      loop_gap_seconds: 90

  # Opt-in (#342). Not the `load` job and not soak.yml: lab/realtable.sh and
  # .github/workflows/realtable.yml, started by a human. The table is one
  # peer's full view from a public RIPE RIS or RouteViews dump, read at run
  # time and never stored in the repository, so `prefixes` comes from the
  # dump. It is observe only, with no flows, churn or probe targets. The
  # per-million figures are the `pr` numbers, applied to paths (prefixes
  # times sessions, so -multiply 3 holds three paths per prefix); nothing was
  # raised. Shutdown and reconverge are reported and not checked: SIGTERM to
  # exit grew with the paths held (docs/performance.md), and nothing churns.
  realtable:
    real: true
    duration: 10m
    warmup: 3m
    sample: 5s
    budgets:
      learn_seconds_per_mprefix: 72
      rss_peak_mb_per_mprefix: 4915.2
      rss_growth_mb_per_mprefix: 307.2
      rss_slope_mb_per_mprefix: 153.6
      cpu_avg_cores: 2.0
      threads: 64
      api_p99_ms: 1500
