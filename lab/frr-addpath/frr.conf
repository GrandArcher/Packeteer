! Simulated edge for the add-path lab (#26). Documentation prefixes, private
! and documentation ASNs only. Packeteer is 192.0.2.10, this router is
! 192.0.2.254, transit-a (AS 64496) is 192.0.2.21, transit-b (AS 64497) is
! 192.0.2.22.
!
! Both transits send 198.51.100.0/24. transit-b prepends, so its path is
! inactive here. addpath-tx-all-paths sends Packeteer every path on the iBGP
! session (add-path, RFC 7911), so transit-b's inactive path, and transit-a's
! while Packeteer's route is best, are visible without BMP.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
bgp community-list standard packeteer permit 64512:666
!
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
route-map deny-all deny 10
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 ! Graceful restart is left off (FRR's default). Do not enable it.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.21 remote-as 64496
 neighbor 192.0.2.21 description transit-a
 neighbor 192.0.2.21 advertisement-interval 0
 neighbor 192.0.2.22 remote-as 64497
 neighbor 192.0.2.22 description transit-b
 neighbor 192.0.2.22 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.10 addpath-tx-all-paths
  neighbor 192.0.2.21 activate
  neighbor 192.0.2.21 route-map deny-all out
  neighbor 192.0.2.22 activate
  neighbor 192.0.2.22 route-map deny-all out
 exit-address-family
!
