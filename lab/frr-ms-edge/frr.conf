! Simulated edge for the more-specific lab (#56). Documentation prefixes,
! private ASN 64512 only. Packeteer is 192.0.2.10, this router is
! 192.0.2.254.
!
! The edge originates 198.51.100.0/24 and three more-specifics inside it
! (198.51.100.0/25, 198.51.100.128/26, 198.51.100.192/27). No other
! prefix inside 198.51.100.0/24 exists here: Packeteer must never
! announce one. lab/e2e-more-specific.sh later adds 203.0.113.0/24 with
! 203.0.113.0/25, and removes more-specifics with "no network".
!
! A network statement has weight 32768, so the edge's own path stays best
! and it keeps advertising every prefix to Packeteer. Removing a network
! statement is then a real RIB leave, not a best-path hide.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
ip route 192.0.2.1/32 blackhole
ip route 192.0.2.2/32 blackhole
!
bgp community-list standard packeteer permit 64512:666
!
route-map to-packeteer permit 10
 set ip next-hop 192.0.2.1
!
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 ! lab/e2e-more-specific.sh bounds the SIGKILL withdraw on this hold time.
 neighbor 192.0.2.10 timers 3 9
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 198.51.100.0/25
  network 198.51.100.128/26
  network 198.51.100.192/27
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 soft-reconfiguration inbound
  neighbor 192.0.2.10 route-map to-packeteer out
  neighbor 192.0.2.10 route-map from-packeteer in
 exit-address-family
!
