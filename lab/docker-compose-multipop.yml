# Multi-POP lab (#30). Two simulated POPs, each one FRR edge and one
# Packeteer instance, federated over mutual TLS. Documentation addresses
# (RFC 5737) and a private ASN only. Brought up by lab/e2e-multipop.sh,
# which sets PACKETEER_LAB_DIR: a/ and b/ hold each instance's probe and
# usage files (re-read by the fixed plugins), certs/ the per-run
# certificates from lab/mkcerts.
name: packeteer-e2e-multipop
x-frr: &frr
  image: quay.io/frrouting/frr:10.2.4
  privileged: true
  entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
x-packeteer: &packeteer
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      VERSION: e2e
  image: packeteer:e2e
  cap_add:
    - NET_RAW
    - NET_ADMIN
    - NET_BIND_SERVICE
services:
  edge-a:
    <<: *frr
    hostname: edge-a
    environment:
      FRR_EXPECT: "router bgp 64512;network 198.51.100.0/24;route-map from-packeteer in"
    volumes:
      - ./frr-mp-edge-a:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
  edge-b:
    <<: *frr
    hostname: edge-b
    environment:
      FRR_EXPECT: "router bgp 64512;network 203.0.113.0/24;route-map from-packeteer in"
    volumes:
      - ./frr-mp-edge-b:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.253
  packeteer-a:
    <<: *packeteer
    depends_on:
      - edge-a
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
    volumes:
      - ./packeteer-multipop-a.yaml:/etc/packeteer/config.yaml:ro
      - ${PACKETEER_LAB_DIR}/a:/etc/packeteer/lab:ro
      - ${PACKETEER_LAB_DIR}/certs:/etc/packeteer/certs:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
  packeteer-b:
    <<: *packeteer
    depends_on:
      - edge-b
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
    volumes:
      - ./packeteer-multipop-b.yaml:/etc/packeteer/config.yaml:ro
      - ${PACKETEER_LAB_DIR}/b:/etc/packeteer/lab:ro
      - ${PACKETEER_LAB_DIR}/certs:/etc/packeteer/certs:ro
    networks:
      lab:
        ipv4_address: 192.0.2.20
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
