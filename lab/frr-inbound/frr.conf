! Simulated edge for the inbound lab (#25). Documentation prefixes, private
! and documentation ASNs only. Packeteer is 192.0.2.10, this router is
! 192.0.2.254, transit-a (AS 64496) is 192.0.2.21, transit-b (AS 64497) is
! 192.0.2.22.
!
! Contract with Packeteer (docs/inbound.md):
!  - A steer route carries 64512:666 (packeteer), 64512:667 (inbound
!    marker), the catalog communities, and no-export.
!  - Import: only marker routes lose no-export and win (weight). Nothing
!    else from Packeteer is exported to a transit (no-export stays).
!  - Export: a signal community becomes a prepend on that transit's
!    session only (transit-a) or withholds the prefix from that transit
!    (transit-b, a selective announcement); a transit's own TE
!    communities go to that transit only; Packeteer's 64512:* communities
!    never leave the edge.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
ip route 203.0.113.0/24 blackhole
ip route 192.0.2.1/32 blackhole
ip route 192.0.2.2/32 blackhole
!
bgp community-list standard packeteer permit 64512:666
bgp community-list standard packeteer-inbound permit 64512:667
bgp community-list standard no-export permit no-export
bgp community-list standard steer-a-prepend2 permit 64512:1102
bgp community-list standard steer-b-withhold permit 64512:1209
! One strip list per transit: FRR keeps only the last `set comm-list
! delete` in a route-map entry, so Packeteer's signals and the other
! transit's TE communities must be in the same list.
bgp community-list standard strip-to-transit-a permit 64512:666
bgp community-list standard strip-to-transit-a permit 64512:667
bgp community-list standard strip-to-transit-a permit 64512:1102
bgp community-list standard strip-to-transit-a permit 64512:1209
bgp community-list standard strip-to-transit-a permit 64497:70
bgp community-list standard strip-to-transit-b permit 64512:666
bgp community-list standard strip-to-transit-b permit 64512:667
bgp community-list standard strip-to-transit-b permit 64512:1102
bgp community-list standard strip-to-transit-b permit 64512:1209
bgp community-list standard strip-to-transit-b permit 64496:3
!
route-map to-packeteer permit 10
 set ip next-hop 192.0.2.1
!
route-map from-packeteer permit 5
 match community packeteer-inbound
 set comm-list no-export delete
 set weight 65535
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
route-map to-transit-a permit 10
 match community steer-a-prepend2
 set as-path prepend 64512 64512
 set comm-list strip-to-transit-a delete
route-map to-transit-a permit 20
 set comm-list strip-to-transit-a delete
!
route-map to-transit-b deny 10
 match community steer-b-withhold
route-map to-transit-b permit 20
 set comm-list strip-to-transit-b delete
!
route-map deny-all deny 10
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart stays off (FRR's default) on every session.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 ! lab/e2e-inbound.sh bounds the SIGKILL withdraw on this hold time.
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.21 remote-as 64496
 neighbor 192.0.2.21 description transit-a
 neighbor 192.0.2.21 advertisement-interval 0
 neighbor 192.0.2.22 remote-as 64497
 neighbor 192.0.2.22 description transit-b
 neighbor 192.0.2.22 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 soft-reconfiguration inbound
  neighbor 192.0.2.10 route-map to-packeteer out
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.21 activate
  neighbor 192.0.2.21 next-hop-self
  neighbor 192.0.2.21 send-community
  neighbor 192.0.2.21 route-map deny-all in
  neighbor 192.0.2.21 route-map to-transit-a out
  neighbor 192.0.2.22 activate
  neighbor 192.0.2.22 next-hop-self
  neighbor 192.0.2.22 send-community
  neighbor 192.0.2.22 route-map deny-all in
  neighbor 192.0.2.22 route-map to-transit-b out
 exit-address-family
!
