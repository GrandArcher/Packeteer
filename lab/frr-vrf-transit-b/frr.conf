! Simulated transit-b for the VRF lab (#206). Documentation ASN 64497. It
! sends a default route only. lab/e2e-vrf.sh also checks that Packeteer's
! route never reaches it.
frr version 10.2
frr defaults traditional
hostname transit-b
log stdout informational
!
router bgp 64497
 bgp router-id 192.0.2.22
 no bgp ebgp-requires-policy
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge
 neighbor 192.0.2.254 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 default-originate
 exit-address-family
!
