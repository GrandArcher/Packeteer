! Simulated edge for the leak watch lab (#199). Documentation prefixes,
! private ASN 64512 and 64511 only. Packeteer is 192.0.2.10, this router is
! 192.0.2.254, and "ext" (AS 64511, 192.0.2.30) is an eBGP peer outside the
! AS that streams its Adj-RIB-In to Packeteer over BMP.
!
! The edge originates 198.51.100.0/24 and 203.0.113.0/24 (the prefixes
! Packeteer injects) and 192.0.2.64/26 (an own prefix that is meant to be
! seen outside). The export filter toward ext lets only 192.0.2.64/26
! through. Packeteer's routes win here (weight 40000) and carry NO_EXPORT,
! which FRR honors on eBGP, so a clean run exports none of them.
!
! lab/e2e-leak-watch.sh then breaks the edge the way a real misconfiguration
! does: the import policy from Packeteer strips communities and the export
! filter lets 203.0.113.0/24 through.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
ip route 192.0.2.1/32 blackhole
ip route 192.0.2.2/32 blackhole
!
bgp community-list standard packeteer permit 64512:666
!
ip prefix-list ext-ok seq 10 permit 192.0.2.64/26
!
route-map to-packeteer permit 10
 set ip next-hop 192.0.2.1
!
route-map from-packeteer permit 10
 match community packeteer
 set weight 40000
route-map from-packeteer deny 100
!
route-map to-ext permit 10
 match ip address prefix-list ext-ok
route-map to-ext deny 100
!
route-map deny-all deny 10
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 ! lab/e2e-leak-watch.sh bounds the SIGKILL withdraw on this hold time.
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.30 remote-as 64511
 neighbor 192.0.2.30 description ext
 neighbor 192.0.2.30 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 203.0.113.0/24
  network 192.0.2.64/26
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 soft-reconfiguration inbound
  neighbor 192.0.2.10 route-map to-packeteer out
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.30 activate
  neighbor 192.0.2.30 route-map to-ext out
  neighbor 192.0.2.30 route-map deny-all in
 exit-address-family
!
service integrated-vtysh-config
