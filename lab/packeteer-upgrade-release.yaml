# Lab only (#644). Documentation prefixes, private ASN. Observe: nothing is
# announced. sqlite history and sign-in are on, so users, events, the audit
# log, pins, the pause and acknowledgements live on the packeteer-data volume.
# transit-b has a source_ip that is not on the host, so it is marked down and
# raises the provider.down alert the script acknowledges.
mode: observe
asn: 64512
router_id: 192.0.2.10
max_improvements: 50
hold_time: 5s
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.10
    next_hop: 192.0.2.1
    path_check: false
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
allowlist:
  prefixes:
    - 198.51.100.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
  workers: 2
  rate_limit_pps: 50
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/prefer-a.yaml
http:
  listen: 0.0.0.0:8080
storage:
  type: sqlite
auth:
  enabled: true
