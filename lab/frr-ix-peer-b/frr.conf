! Simulated exchange member ix-peer-b for the IX lab (#27). Documentation
! ASN 64502 on the simulated peering LAN 203.0.113.0/24. It sends only
! 198.51.100.128/25, never the /24. It is the fastest probed peer; the
! route check must keep Packeteer from steering the /24 to it.
frr version 10.2
frr defaults traditional
hostname ix-peer-b
log stdout informational
!
route-map deny-all deny 10
!
route-map to-edge permit 10
!
router bgp 64502
 bgp router-id 203.0.113.12
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 203.0.113.1 remote-as 64512
 neighbor 203.0.113.1 description edge
 neighbor 203.0.113.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 198.51.100.128/25
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 route-map deny-all in
  neighbor 203.0.113.1 route-map to-edge out
 exit-address-family
!
