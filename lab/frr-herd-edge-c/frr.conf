! Simulated edge of member-c for the herd lab (#260, #659, #672). Documentation
! prefixes and documentation ASNs only. Each member has its own AS, so the
! hub lists one entry per member. This router (AS 64498, 192.0.2.252) learns
! 192.0.2.128/26 (path "64501 64510"), 192.0.2.192/27 (path "64501 64511"),
! and 192.0.2.224/28 (path "64501 64509") from the upstream (AS 64501, 192.0.2.21) and sends them
! over iBGP, next hop unchanged, to member-c at 192.0.2.12. The member announces
! nothing: it runs in observe mode and the edge accepts no route from it.
frr version 10.2
frr defaults traditional
hostname edge-c
log stdout informational
!
route-map from-member deny 10
!
router bgp 64498
 bgp router-id 192.0.2.252
 no bgp ebgp-requires-policy
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor 192.0.2.12 remote-as 64498
 neighbor 192.0.2.12 description member-c
 neighbor 192.0.2.12 passive
 neighbor 192.0.2.12 timers 3 9
 neighbor 192.0.2.21 remote-as 64501
 neighbor 192.0.2.21 description upstream
 neighbor 192.0.2.21 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 192.0.2.12 activate
  neighbor 192.0.2.12 route-map from-member in
  neighbor 192.0.2.12 soft-reconfiguration inbound
  neighbor 192.0.2.21 activate
 exit-address-family
!
