# Lab only (lab/e2e-ix-port.sh, #643). Documentation prefixes, private and
# documentation ASNs. The IX lab of lab/packeteer-ix.yaml with a shared port
# on ix-lab: 1000 Mbps capacity, a 600 Mbps commit. The port's usage is the
# fixed telemetry row named ix-lab, which the e2e script rewrites; the
# prefix carries 60 Mbps. ix-peer-a is faster than transit-a, so a
# performance move onto it is wanted, and the port decides whether it is
# made. The script runs this file as is (observe) and then with mode:
# inject.
mode: observe
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5m
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.21
exchanges:
  - name: ix-lab
    lans: [203.0.113.0/24]
    port: {capacity_mbps: 1000, commit_mbps: 600}
    peers:
      - name: ix-peer-a
        asn: 64501
        next_hop: 203.0.113.11
        source_ip: 192.0.2.31
      - name: ix-peer-b
        asn: 64502
        next_hop: 203.0.113.12
        source_ip: 192.0.2.32
allowlist:
  prefixes:
    - 198.51.100.0/24
probe:
  path_check: {enabled: false}
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  as_path: provider
  neighbors:
    - address: 192.0.2.254
      description: edge
      add_path: true
http:
  listen: 127.0.0.1:8080
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
          mbps: 60
probers:
  - type: fixed
    config:
      file: /etc/packeteer/lab/state.yaml
telemetry:
  - type: fixed
    config:
      file: /etc/packeteer/lab/usage.yaml
announcer:
  type: gobgp

# Lab only: no sign-in, so the e2e scripts can read the API (#328).
auth:
  enabled: false
