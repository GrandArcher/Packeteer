! Simulated transit for the inbound MED lab (#303). Documentation ASN
! 64496. It has two sessions to the edge (AS 64512) and only receives:
! lab/e2e-inbound-med.sh reads which session the edge's prefix is best on
! and the MED on each.
frr version 10.2
frr defaults traditional
hostname transit-m
log stdout informational
!
route-map deny-all deny 10
!
router bgp 64496
 bgp router-id 192.0.2.23
 no bgp ebgp-requires-policy
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge-link-1
 neighbor 192.0.2.254 advertisement-interval 0
 neighbor 198.51.100.254 remote-as 64512
 neighbor 198.51.100.254 description edge-link-2
 neighbor 198.51.100.254 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 route-map deny-all out
  neighbor 198.51.100.254 activate
  neighbor 198.51.100.254 route-map deny-all out
 exit-address-family
!
