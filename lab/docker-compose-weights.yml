# Improvement-weights lab (#34). One simulated FRR edge and Packeteer.
# Documentation addresses (RFC 5737) and a private ASN only. Brought up by
# lab/e2e-weights.sh.
name: packeteer-e2e-weights
services:
  edge:
    image: quay.io/frrouting/frr:10.2.4
    hostname: edge
    privileged: true
    entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
    environment:
      FRR_EXPECT: "router bgp 64512;network 203.0.113.0/24;route-map from-packeteer in"
    volumes:
      - ./frr-wt-edge:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
  packeteer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    depends_on:
      - edge
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
    volumes:
      - ./packeteer-weights.yaml:/etc/packeteer/config.yaml:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
