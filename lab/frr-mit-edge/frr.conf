! Simulated edge for the threat mitigation lab (#28). Documentation
! prefixes, private and documentation ASNs only. Packeteer is 192.0.2.10,
! this router is 192.0.2.254, transit-a (AS 64496) is 192.0.2.21 and
! originates 198.51.100.0/24, transit-b (AS 64497) is 192.0.2.22 and only
! receives.
!
! Contract with Packeteer (docs/mitigation.md):
!  - A mitigation route carries 64512:666 (packeteer), 64512:668 (the
!    mitigation marker), the action's communities, and no-export.
!  - Import: marker routes win (weight) and keep their next hop. RTBH
!    routes point at 192.0.2.66, which is routed to null here; redirect
!    routes point at the scrubber 192.0.2.77 on the lab LAN.
!  - no-export stays on every Packeteer route: nothing Packeteer sends is
!    exported to a transit.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
ip route 192.0.2.66/32 blackhole
!
bgp community-list standard packeteer permit 64512:666
bgp community-list standard packeteer-mitigation permit 64512:668
bgp community-list standard strip-to-transit permit 64512:666
bgp community-list standard strip-to-transit permit 64512:668
bgp community-list standard strip-to-transit permit 64512:777
!
route-map from-packeteer permit 5
 match community packeteer-mitigation
 set weight 65535
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
route-map from-transit permit 10
!
route-map to-transit-b permit 10
 set comm-list strip-to-transit delete
!
route-map deny-all deny 10
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 ! Graceful restart stays off (FRR's default) on every session.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 ! lab/e2e-mitigation.sh bounds the SIGKILL withdraw on this hold time.
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.21 remote-as 64496
 neighbor 192.0.2.21 description transit-a
 neighbor 192.0.2.21 advertisement-interval 0
 neighbor 192.0.2.22 remote-as 64497
 neighbor 192.0.2.22 description transit-b
 neighbor 192.0.2.22 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 soft-reconfiguration inbound
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.21 activate
  neighbor 192.0.2.21 route-map from-transit in
  neighbor 192.0.2.21 route-map deny-all out
  neighbor 192.0.2.22 activate
  neighbor 192.0.2.22 next-hop-self
  neighbor 192.0.2.22 send-community
  neighbor 192.0.2.22 route-map deny-all in
  neighbor 192.0.2.22 route-map to-transit-b out
 exit-address-family
!
