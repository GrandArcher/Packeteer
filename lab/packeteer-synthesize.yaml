# Lab only (#122). Documentation prefixes, private ASNs. NEVER use this on
# a production edge: synthesize announces prefixes that are not in the
# learned RIB.
#
# lab/sendflow sends equal traffic to 198.51.100.10 and 198.51.100.200, and
# to 203.0.113.10 and 203.0.113.200. The flow source measures each learned
# /24 as two /25s. The fixed prober makes transit-b faster toward the low
# /25 and transit-a (the native exit) faster toward the high one, so each
# /24's weighted score stays native and only the low /25 is worth steering.
# The route cap is 1 (more_specific.max_routes, shared with synthesize):
# 198.51.100.0/25 is announced and 203.0.113.0/25 waits.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5s
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
allowlist:
  prefixes:
    - 198.51.100.0/24
    - 203.0.113.0/24
more_specific:
  enabled: false
  max_routes: 1
synthesize:
  enabled: true
  covering_prefixes:
    - 198.51.100.0/24
    - 203.0.113.0/24
  max_bits: 1
  max_prefix_len:
    v4: 25
  marker_community: "64512:667"
leak_watch:
  enabled: true
  sources:
    - type: bmp
      config:
        external_routers: [192.0.2.30]
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
http:
  listen: 0.0.0.0:8080
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
sources:
  - type: flow
    config:
      listen: 0.0.0.0:2055
      window: 30s
      subranges:
        bits_v4: 25
        max_subranges: 2
probers:
  - type: fixed
    config:
      rtt_ms: 25
      paths:
        - provider: transit-a
          target: 198.51.100.10
          rtt_ms: 40
        - provider: transit-b
          target: 198.51.100.10
          rtt_ms: 10
        - provider: transit-a
          target: 198.51.100.200
          rtt_ms: 10
        - provider: transit-b
          target: 198.51.100.200
          rtt_ms: 40
        - provider: transit-a
          target: 203.0.113.10
          rtt_ms: 40
        - provider: transit-b
          target: 203.0.113.10
          rtt_ms: 10
        - provider: transit-a
          target: 203.0.113.200
          rtt_ms: 10
        - provider: transit-b
          target: 203.0.113.200
          rtt_ms: 40
announcer:
  type: gobgp

# Lab only: no sign-in, so the e2e script can read the API (#328).
auth:
  enabled: false
