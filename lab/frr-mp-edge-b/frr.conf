! Simulated edge of POP B for the multi-POP lab (#30). Documentation
! prefixes, private ASN 64512 only. packeteer-b is 192.0.2.20, this
! router is 192.0.2.253.
!
! POP B has learned 198.51.100.0/24 and 203.0.113.0/24. Native traffic
! leaves through x-b (next hop 192.0.2.5).
frr version 10.2
frr defaults traditional
hostname edge-b
log stdout informational
!
ip route 192.0.2.5/32 blackhole
!
bgp community-list standard packeteer permit 64512:666
!
route-map to-packeteer permit 10
 set ip next-hop 192.0.2.5
!
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
router bgp 64512
 bgp router-id 192.0.2.253
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor 192.0.2.20 remote-as 64512
 neighbor 192.0.2.20 description packeteer-b
 neighbor 192.0.2.20 passive
 neighbor 192.0.2.20 timers 3 9
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 203.0.113.0/24
  neighbor 192.0.2.20 activate
  neighbor 192.0.2.20 soft-reconfiguration inbound
  neighbor 192.0.2.20 route-map to-packeteer out
  neighbor 192.0.2.20 route-map from-packeteer in
 exit-address-family
!
