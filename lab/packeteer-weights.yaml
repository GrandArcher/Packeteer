# Lab only (#34). Documentation prefixes, private ASN. transit-b is always
# the faster probed path (the fixed prober sends no packets), so every
# probed prefix has the same score gain. max_improvements is 1, and the
# scorer's improvement_weights add the declared volume: the heavier
# 203.0.113.0/24 takes the slot although 198.51.100.0/24 sorts first.
# 198.51.100.0/25 is the heaviest and allowlisted, but the edge never
# advertises it: it must never be announced.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 1
hold_time: 5s
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
allowlist:
  prefixes:
    - 198.51.100.0/24
    - 203.0.113.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
          mbps: 5
        - prefix: 203.0.113.0/24
          host: 203.0.113.1
          mbps: 500
        - prefix: 198.51.100.0/25
          host: 198.51.100.10
          mbps: 9000
probers:
  - type: fixed
    config:
      paths:
        - provider: transit-a
          rtt_ms: 80
        - provider: transit-b
          rtt_ms: 10
scorer:
  type: weighted
  config:
    improvement_weights:
      performance: 1
      volume: 1
announcer:
  type: gobgp
