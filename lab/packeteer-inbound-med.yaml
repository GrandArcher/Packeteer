# Lab only (#303). Documentation prefixes, private and documentation ASNs.
# link-1 and link-2 are two sessions to one transit (AS 64496). When
# link-1's inbound 95th is over its commit, 203.0.113.0/24 is re-announced
# to the edge with link-1's MED signal, and the edge sets MED 100 on link 1
# only, so the transit prefers link 2. lab/e2e-inbound-med.sh rewrites the
# usage file to steer and release.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5s
improvement_ttl: 1h
# Outbound thresholds out of reach: no outbound improvement is made.
thresholds:
  min_loss_delta_pct: 90
  min_rtt_delta_ms: 5000
providers:
  # Both links are the same AS: a MED action needs another link to it.
  - name: link-1
    asn: 64496
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: link-2
    asn: 64496
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
allowlist:
  prefixes:
    - 203.0.113.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
# The fixed prober sends no packets; it re-reads paths.yaml.
sources:
  - type: static
    config:
      targets:
        - prefix: 192.0.2.128/25
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/paths.yaml
telemetry:
  - type: fixed
    config:
      file: /etc/packeteer/probes/usage.yaml
announcer:
  type: gobgp
inbound:
  mode: inject
  prefixes:
    - 203.0.113.0/24
  local_pref: 1
  release_pct: 90
  # Lab-scale damping: confirm 4s, hold doubles per flap up to 60s.
  damping:
    confirm: 4s
    backoff: 2
    max_hold: 60s
  announcer:
    type: gobgp
    config:
      marker: "64512:667"
      providers:
        # The edge sets MED 100 toward the transit on link 1 for 64512:1301
        # and on link 2 for 64512:1302.
        - provider: link-1
          name: med-100
          med: 100
          communities: ["64512:1301"]
        - provider: link-2
          name: med-100
          med: 100
          communities: ["64512:1302"]

# Lab only: no sign-in, so the e2e scripts can read the API (#328).
auth:
  enabled: false
