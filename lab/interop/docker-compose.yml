# Router interop matrix (#53). One simulated edge (FRR, BIRD 2, BIRD 3, or
# GoBGP; pick it with --profile) between Packeteer and two simulated FRR
# eBGP transits. Documentation addresses (RFC 5737) and documentation /
# private ASNs only. Brought up by lab/e2e-interop.sh, which sets
# PACKETEER_LAB_DIR (the fixed prober's state.yaml), INTEROP_PACKETEER_CONFIG,
# INTEROP_BIRD_CONF, and INTEROP_GOBGP_DIR.
name: packeteer-interop
x-frr: &frr
  image: quay.io/frrouting/frr:10.2.4
  privileged: true
  entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
x-edge: &edge
  hostname: edge
  networks:
    lab:
      ipv4_address: 192.0.2.254
x-bird: &bird
  <<: *edge
  environment:
    BIRD_CONF: ${INTEROP_BIRD_CONF:-bird.conf}
  volumes:
    - ./bird:/etc/bird:ro
services:
  edge-frr:
    <<: [*frr, *edge]
    profiles: [frr]
    environment:
      FRR_EXPECT: "addpath-tx-all-paths;route-map from-packeteer in;bmp targets packeteer"
    volumes:
      - ./frr:/etc/frr
      - ../frr-start.sh:/lab/frr-start.sh:ro
  edge-bird2:
    <<: *bird
    profiles: [bird2]
    build:
      context: ./bird
      args:
        BIRD: bird2
    image: packeteer-interop-bird:2
  edge-bird3:
    <<: *bird
    profiles: [bird3]
    build:
      context: ./bird
      args:
        BIRD: bird3
    image: packeteer-interop-bird:3
  edge-gobgp:
    <<: *edge
    profiles: [gobgp]
    image: debian:trixie-slim
    # gobgpd and gobgp are built by lab/e2e-interop.sh from the GoBGP
    # version in go.mod; the config is gobgp/gobgpd.toml (plus bmp.toml).
    command: ["/opt/gobgp/gobgpd", "-f", "/opt/gobgp/gobgpd.toml", "-p", "--pprof-disable"]
    volumes:
      - ${INTEROP_GOBGP_DIR:-./gobgp}:/opt/gobgp:ro
  transit-a:
    <<: *frr
    hostname: transit-a
    environment:
      FRR_EXPECT: "router bgp 64496;network 198.51.100.0/24"
    volumes:
      - ./frr-transit-a:/etc/frr
      - ../frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.21
  transit-b:
    <<: *frr
    hostname: transit-b
    environment:
      FRR_EXPECT: "router bgp 64497;network 198.51.100.0/24;route-map to-edge out"
    volumes:
      - ./frr-transit-b:/etc/frr
      - ../frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.22
  packeteer:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
    volumes:
      - ${INTEROP_PACKETEER_CONFIG:-./packeteer.yaml}:/etc/packeteer/config.yaml:ro
      - ${PACKETEER_LAB_DIR}:/etc/packeteer/probes:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
