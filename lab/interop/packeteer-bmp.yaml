# Router interop matrix (#53), column "bmp". Lab only: documentation
# prefixes and documentation/private ASNs; never point this at a real edge.
# The iBGP session carries only the edge's best path (transit-a);
# transit-b's inactive path is visible only over BMP (post-policy
# Adj-RIB-In to the station on 192.0.2.10:11019). transit-b is `bmp: only`,
# so its withdraw retires the improvement at once, inside the 5m hold_time.
#
# 203.0.113.0/24 and 198.51.100.128/25 are allowlisted and probed, but no
# router ever advertises them: they are never in the learned RIB and must
# never be announced (lab/e2e-interop.sh checks every sample).
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5m
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.21
    bmp: prefer
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.22
    bmp: only
allowlist:
  prefixes:
    - 198.51.100.0/24
    - 198.51.100.128/25
    - 203.0.113.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
rib_sources:
  - type: bmp
    config:
      listen: "192.0.2.10:11019"
      routers: [192.0.2.254]
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
        - prefix: 198.51.100.128/25
          host: 198.51.100.129
        - prefix: 203.0.113.0/24
          host: 203.0.113.1
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/state.yaml
announcer:
  type: gobgp
