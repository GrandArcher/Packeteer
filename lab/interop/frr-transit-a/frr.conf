! Simulated transit-a for the router interop matrix (#53). Documentation
! ASN 64496, documentation prefix. It sends 198.51.100.0/24 with the
! shorter AS path, so the edge selects it. It keeps what the edge sends
! (soft-reconfiguration inbound) so lab/e2e-interop.sh can check that the
! edge exports nothing, Packeteer's route included, to an eBGP neighbor.
frr version 10.2
frr defaults traditional
hostname transit-a
log stdout informational
!
route-map deny-all deny 10
!
router bgp 64496
 bgp router-id 192.0.2.21
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge
 neighbor 192.0.2.254 advertisement-interval 0
 neighbor 192.0.2.254 timers connect 2
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 soft-reconfiguration inbound
  neighbor 192.0.2.254 route-map deny-all in
 exit-address-family
!
