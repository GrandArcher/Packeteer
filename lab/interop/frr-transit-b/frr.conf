! Simulated transit-b for the router interop matrix (#53). Documentation
! ASN 64497, documentation prefix. It sends 198.51.100.0/24 prepended
! twice, so the edge keeps it as an inactive path. lab/e2e-interop.sh
! withdraws and re-announces it with vtysh. It keeps what the edge sends
! (soft-reconfiguration inbound) for the export check.
frr version 10.2
frr defaults traditional
hostname transit-b
log stdout informational
!
route-map deny-all deny 10
!
route-map to-edge permit 10
 set as-path prepend 64497 64497
!
router bgp 64497
 bgp router-id 192.0.2.22
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge
 neighbor 192.0.2.254 advertisement-interval 0
 neighbor 192.0.2.254 timers connect 2
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 soft-reconfiguration inbound
  neighbor 192.0.2.254 route-map deny-all in
  neighbor 192.0.2.254 route-map to-edge out
 exit-address-family
!
