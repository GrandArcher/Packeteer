# Router interop matrix (#53), column "bmponly" (#237). Lab only:
# documentation prefixes and documentation/private ASNs; never point this at
# a real edge. There is no bgp.neighbors entry and no announcer: the RIB
# view is learned over BMP alone (post-policy Adj-RIB-In, and Loc-RIB where
# the edge sends it), and the route inject would announce is published on
# the external policy feed (#232). When the BMP feed drops the view is not
# ready and the feed empties. The certificate, key, and token are made by
# lab/e2e-interop.sh.
#
# 203.0.113.0/24 and 198.51.100.128/25 are allowlisted and probed, but no
# router ever advertises them: they are never in the learned RIB and must
# never be published (lab/e2e-interop.sh checks every sample).
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5s
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.21
    bmp: prefer
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.22
    bmp: only
allowlist:
  prefixes:
    - 198.51.100.0/24
    - 198.51.100.128/25
    - 203.0.113.0/24
probe:
  path_check: {enabled: false}
  interval: 2s
  timeout: 500ms
  packets: 4
rib_sources:
  - type: bmp
    config:
      listen: "192.0.2.10:11019"
      routers: [192.0.2.254]
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
        - prefix: 198.51.100.128/25
          host: 198.51.100.129
        - prefix: 203.0.113.0/24
          host: 203.0.113.1
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/state.yaml
external_policy:
  enabled: true
  listen: 192.0.2.10:9443
  cert_file: /etc/packeteer/probes/cert.pem
  key_file: /etc/packeteer/probes/key.pem
  ttl: 10s

# Lab only: no sign-in, so the e2e scripts can read the API (#328).
auth:
  enabled: false
