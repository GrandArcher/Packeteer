# bird.conf plus a BMP feed to Packeteer's station (#53). BIRD 3 only: the
# Debian/Alpine BIRD 2 builds leave the BMP protocol out. Lab only.
include "/etc/bird/bird.conf";

protocol bmp {
	station address ip 192.0.2.10 port 11019;
	# Post-policy Adj-RIB-In: what each session's import filter accepted.
	# Packeteer never reads pre-policy.
	monitoring rib in post_policy;
}
