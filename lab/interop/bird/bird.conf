# Simulated BIRD edge for the router interop matrix (#53). Lab only:
# documentation prefixes (RFC 5737) and documentation/private ASNs.
# Packeteer is 192.0.2.10, this router is 192.0.2.254, transit-a (AS 64496)
# is 192.0.2.21, transit-b (AS 64497) is 192.0.2.22. Works on BIRD 2 and 3.
#
# Both transits send 198.51.100.0/24; transit-b prepends, so its path is
# inactive here. The Packeteer session offers add-path send (`add paths
# tx`): it is used only when Packeteer asks for it (bgp.neighbors[].add_path),
# otherwise the session carries the best path alone. bird-bmp.conf adds BMP.
log stderr all;
router id 192.0.2.254;

protocol device {}

# The connected lab LAN, so BGP next hops (192.0.2.21, 192.0.2.22) resolve.
protocol direct {
	ipv4;
}

# Accept only routes that carry Packeteer's community.
filter from_packeteer {
	if (64512, 666) ~ bgp_community then accept;
	reject;
}

template bgp upstream {
	local 192.0.2.254 as 64512;
	ipv4 {
		import all;
		# Never export to an eBGP neighbor: Packeteer's routes stay here.
		export none;
	};
}

protocol bgp packeteer {
	description "packeteer";
	local 192.0.2.254 as 64512;
	neighbor 192.0.2.10 as 64512;
	passive on;
	# Packeteer is on the same LAN; next hops (192.0.2.21, 192.0.2.22) are
	# resolved directly instead of through the IGP table.
	direct;
	# 9s wins against Packeteer's 90s proposal; lab/e2e-interop.sh bounds
	# the SIGKILL withdraw on it. Graceful restart off: Packeteer's routes
	# must disappear with the session.
	hold time 9;
	keepalive time 3;
	graceful restart off;
	long lived graceful restart off;
	ipv4 {
		import filter from_packeteer;
		export where source = RTS_BGP;
		add paths tx;
	};
}

protocol bgp transit_a from upstream {
	description "transit-a";
	neighbor 192.0.2.21 as 64496;
}

protocol bgp transit_b from upstream {
	description "transit-b";
	neighbor 192.0.2.22 as 64497;
}
