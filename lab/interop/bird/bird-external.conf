# bird.conf plus the external policy feed (#232). Lab only. Packeteer has no
# announcer in this cell, so its session only learns. packeteer-policy, run
# in this container by lab/e2e-interop.sh, renders the feed into
# /opt/feed/routes.conf (examples/external-policy/bird.conf.tmpl) and runs
# birdc configure. The script creates the file empty.
include "/etc/bird/bird.conf";
include "/opt/feed/routes.conf";
