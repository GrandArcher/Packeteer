# Lab only (#31). pk-b of an active/standby pair: same providers,
# allowlist, and edge as the other instance; its own router_id and ha id.
# Documentation prefix, private ASN. The fixed prober sends no packets.
mode: inject
asn: 64512
router_id: 192.0.2.20
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5s
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
allowlist:
  prefixes:
    - 198.51.100.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
  workers: 2
  rate_limit_pps: 50
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/state.yaml
announcer:
  type: gobgp
storage:
  type: sqlite
  config:
    path: /var/lib/packeteer/data/packeteer.db
# Both instances mount the same volume on /var/lib/packeteer/ha. With the
# edge's 9s hold time a standby waits max(4s, 2s + 9s + 1s) = 12s after
# the lease last changed before it takes over from a crashed instance.
ha:
  type: lease
  config:
    path: /var/lib/packeteer/ha/lease.json
    id: pk-b
    ttl: 4s
    renew: 1s
