# Synthesize lab (#122). A simulated FRR edge, a simulated transit outside
# the AS that streams BMP to Packeteer, and Packeteer. Documentation
# addresses (RFC 5737) and private ASNs only. Brought up by
# lab/e2e-synthesize.sh, which also sends synthetic NetFlow from the host.
name: packeteer-e2e-synthesize
x-frr: &frr
  image: quay.io/frrouting/frr:10.2.4
  privileged: true
  entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
services:
  edge:
    <<: *frr
    hostname: edge
    environment:
      FRR_EXPECT: "router bgp 64512;network 203.0.113.0/24;route-map from-packeteer in;route-map to-ext out"
    volumes:
      - ./frr-syn-edge:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
  ext:
    <<: *frr
    hostname: ext
    environment:
      FRR_EXPECT: "router bgp 64511;bmp targets packeteer;bmp connect 192.0.2.10 port 11020"
    volumes:
      - ./frr-syn-ext:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.30
  packeteer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    depends_on:
      - edge
      - ext
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
    volumes:
      - ./packeteer-synthesize.yaml:/etc/packeteer/config.yaml:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
