! Simulated transit-a for the threat mitigation lab (#28). Documentation
! ASN 64496 and documentation prefix 198.51.100.0/24, which it originates
! toward the edge. It receives nothing.
frr version 10.2
frr defaults traditional
hostname transit-a
log stdout informational
!
ip route 198.51.100.0/24 blackhole
!
route-map deny-all deny 10
!
router bgp 64496
 bgp router-id 192.0.2.21
 no bgp ebgp-requires-policy
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge
 neighbor 192.0.2.254 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 route-map deny-all in
 exit-address-family
!
