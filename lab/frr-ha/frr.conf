! Simulated edge for the HA lab (#31). Documentation prefix, private ASN
! 64512 only. pk-a is 192.0.2.10 and pk-b is 192.0.2.20, both Packeteer
! instances of one active/standby pair; this router is 192.0.2.254.
!
! Native exit for 198.51.100.0/24 is transit-a (next hop 192.0.2.1). The
! network statement's weight keeps it best, so the router keeps
! advertising it to both instances while one of them announces.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
ip route 198.51.100.0/24 blackhole
ip route 192.0.2.1/32 blackhole
ip route 192.0.2.2/32 blackhole
!
bgp community-list standard packeteer permit 64512:666
!
route-map to-packeteer permit 10
 set ip next-hop 192.0.2.1
!
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart stays off (FRR's default). Do not enable it: a dead
 ! instance's routes must go with its session.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description pk-a
 neighbor 192.0.2.10 passive
 neighbor 192.0.2.20 remote-as 64512
 neighbor 192.0.2.20 description pk-b
 neighbor 192.0.2.20 passive
 ! Hold time 9s wins against Packeteer's 90s proposal. Each instance
 ! writes it into the lease, and the standby waits it out after a crash.
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.20 timers 3 9
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 soft-reconfiguration inbound
  neighbor 192.0.2.10 route-map to-packeteer out
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.20 activate
  neighbor 192.0.2.20 soft-reconfiguration inbound
  neighbor 192.0.2.20 route-map to-packeteer out
  neighbor 192.0.2.20 route-map from-packeteer in
 exit-address-family
!
