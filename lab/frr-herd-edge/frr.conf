! Simulated edge for the herd lab (#260). Documentation prefix and
! documentation or private ASNs only. This router (AS 64512, 192.0.2.254)
! learns 192.0.2.128/26 from the upstream (AS 64501, 192.0.2.21, path
! "64501 64510") and sends it over iBGP, next hop unchanged, to the three
! members at 192.0.2.10 (a), 192.0.2.11 (b), and 192.0.2.12 (c). The
! members announce nothing: they run in observe mode and the edge accepts
! no route from them.
frr version 10.2
frr defaults traditional
hostname edge
log stdout informational
!
route-map from-members deny 10
!
router bgp 64512
 bgp router-id 192.0.2.254
 no bgp ebgp-requires-policy
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor members peer-group
 neighbor members remote-as 64512
 neighbor members passive
 neighbor members timers 3 9
 neighbor 192.0.2.10 peer-group members
 neighbor 192.0.2.10 description member-a
 neighbor 192.0.2.11 peer-group members
 neighbor 192.0.2.11 description member-b
 neighbor 192.0.2.12 peer-group members
 neighbor 192.0.2.12 description member-c
 neighbor 192.0.2.21 remote-as 64501
 neighbor 192.0.2.21 description upstream
 neighbor 192.0.2.21 timers 3 9
 !
 address-family ipv4 unicast
  neighbor members activate
  neighbor members route-map from-members in
  neighbor members soft-reconfiguration inbound
  neighbor 192.0.2.21 activate
 exit-address-family
!
