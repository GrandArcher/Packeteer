# Lab only (#27). Documentation prefixes, private and documentation ASNs.
# One iBGP session to the route reflector, which reflects Packeteer's
# routes to both edges with the provider's next hop unchanged. Every edge
# must reach every provider's next hop (here: one shared lab network; in a
# real network, the IGP). lab/e2e-multirouter.sh checks both edges.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5m
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
providers:
  - name: transit-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.21
  - name: transit-b
    source_ip: 192.0.2.12
    next_hop: 192.0.2.22
allowlist:
  prefixes:
    - 198.51.100.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.250
      description: rr
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
# transit-b is always the faster path.
probers:
  - type: fixed
    config:
      file: /etc/packeteer/probes/state.yaml
announcer:
  type: gobgp
