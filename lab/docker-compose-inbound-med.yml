# Inbound MED lab (#303). Simulated edge with two sessions to one simulated
# transit (link 1 on the lab network, link 2 on the link2 network).
# Documentation addresses (RFC 5737) and documentation/private ASNs only.
# Brought up by lab/e2e-inbound-med.sh, which sets PACKETEER_LAB_DIR to a
# directory containing usage.yaml and paths.yaml.
name: packeteer-e2e-inbound-med
x-frr: &frr
  image: quay.io/frrouting/frr:10.2.4
  privileged: true
  entrypoint: ["/bin/sh", "/lab/frr-start.sh"]
services:
  edge:
    <<: *frr
    hostname: edge
    environment:
      FRR_EXPECT: "network 203.0.113.0/24;route-map from-packeteer in;route-map to-link-1 out;route-map to-link-2 out"
    volumes:
      - ./frr-inbound-med:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.254
      link2:
        ipv4_address: 198.51.100.254
  transit-m:
    <<: *frr
    hostname: transit-m
    environment:
      FRR_EXPECT: "router bgp 64496;neighbor 192.0.2.254 remote-as 64512;neighbor 198.51.100.254 remote-as 64512"
    volumes:
      - ./frr-transit-m:/etc/frr
      - ./frr-start.sh:/lab/frr-start.sh:ro
    networks:
      lab:
        ipv4_address: 192.0.2.23
      link2:
        ipv4_address: 198.51.100.23
  packeteer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    image: packeteer:e2e
    depends_on:
      - edge
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PACKETEER_CONFIG: /etc/packeteer/config.yaml
      PACKETEER_LOG_LEVEL: debug
    volumes:
      - ./packeteer-inbound-med.yaml:/etc/packeteer/config.yaml:ro
      - ${PACKETEER_LAB_DIR}:/etc/packeteer/probes:ro
    networks:
      lab:
        ipv4_address: 192.0.2.10
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.3
  link2:
    driver: bridge
    ipam:
      config:
        - subnet: 198.51.100.0/24
          gateway: 198.51.100.3
