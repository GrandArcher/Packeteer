! Simulated route reflector for the multi-router lab (#27). Private ASN
! 64512. edge-a (192.0.2.251), edge-b (192.0.2.252), and Packeteer
! (192.0.2.10) are its clients. It accepts only routes tagged 64512:666
! from Packeteer and reflects them, next hop unchanged, to both edges.
frr version 10.2
frr defaults traditional
hostname rr
log stdout informational
!
bgp community-list standard packeteer permit 64512:666
!
route-map from-packeteer permit 10
 match community packeteer
route-map from-packeteer deny 100
!
router bgp 64512
 bgp router-id 192.0.2.250
 bgp cluster-id 192.0.2.250
 ! Graceful restart is left off (FRR's default). Do not enable it.
 neighbor 192.0.2.10 remote-as 64512
 neighbor 192.0.2.10 description packeteer
 neighbor 192.0.2.10 passive
 neighbor 192.0.2.10 timers 3 9
 neighbor 192.0.2.251 remote-as 64512
 neighbor 192.0.2.251 description edge-a
 neighbor 192.0.2.251 timers 3 9
 neighbor 192.0.2.252 remote-as 64512
 neighbor 192.0.2.252 description edge-b
 neighbor 192.0.2.252 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 route-reflector-client
  neighbor 192.0.2.10 route-map from-packeteer in
  neighbor 192.0.2.251 activate
  neighbor 192.0.2.251 route-reflector-client
  neighbor 192.0.2.252 activate
  neighbor 192.0.2.252 route-reflector-client
 exit-address-family
!
