# Lab only (#30). POP A of two federated instances. Documentation
# prefixes, private ASN. x-a and y-a exit here; x-b is carrier X in POP B,
# measured by packeteer-b and reached at edge-b (192.0.2.253) across the
# backbone. The allowlist includes 203.0.113.0/24, which only POP B has
# learned: it must never be announced to edge-a. Probe results and usage
# come from files that lab/e2e-multipop.sh rewrites. Certificates are
# generated per run by lab/mkcerts.
mode: inject
asn: 64512
router_id: 192.0.2.10
packeteer_community: "64512:666"
local_pref: 250
max_improvements: 50
hold_time: 5s
improvement_ttl: 1h
thresholds:
  min_loss_delta_pct: 1
  min_rtt_delta_ms: 15
instance: pop-a
domain: pop-a
inter_dc_rtt:
  pop-b: 10ms
providers:
  - name: x-a
    source_ip: 192.0.2.11
    next_hop: 192.0.2.1
  - name: y-a
    source_ip: 192.0.2.12
    next_hop: 192.0.2.2
  - name: x-b
    domain: pop-b
    next_hop: 192.0.2.253
    # Moving carrier X traffic to carrier X in another POP does not relieve
    # the shared commit.
    cc_disable: true
global_commit:
  - name: carrier-x
    commit_mbps: 100
    providers: [x-a, x-b]
federation:
  type: mtls
  config:
    listen: 0.0.0.0:9443
    cert_file: /etc/packeteer/certs/pop-a.crt
    key_file: /etc/packeteer/certs/pop-a.key
    ca_file: /etc/packeteer/certs/ca.crt
    poll_interval: 1s
    max_age: 3s
    peers:
      - name: pop-b
        url: https://192.0.2.20:9443
allowlist:
  prefixes:
    - 198.51.100.0/24
    - 203.0.113.0/24
probe:
  interval: 2s
  timeout: 500ms
  packets: 4
bgp:
  neighbors:
    - address: 192.0.2.254
      description: edge-a
sources:
  - type: static
    config:
      targets:
        - prefix: 198.51.100.0/24
          host: 198.51.100.1
          mbps: 30
        - prefix: 203.0.113.0/24
          host: 203.0.113.1
          mbps: 30
probers:
  - type: fixed
    config:
      file: /etc/packeteer/lab/state.yaml
scorer:
  type: commit
telemetry:
  - type: fixed
    config:
      file: /etc/packeteer/lab/usage.yaml
announcer:
  type: gobgp
