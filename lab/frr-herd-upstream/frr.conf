! Simulated upstream for the herd lab (#260). Documentation prefix and
! documentation ASNs only. This router (AS 64501, 192.0.2.21) originates
! 192.0.2.128/26 behind origin AS 64510 and owns 192.0.2.130 on its
! loopback, so the members' ICMP probes get real replies. The edge is
! 192.0.2.254.
frr version 10.2
frr defaults traditional
hostname upstream
log stdout informational
!
route-map behind-origin permit 10
 set as-path prepend 64510
!
router bgp 64501
 bgp router-id 192.0.2.21
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor 192.0.2.254 remote-as 64512
 neighbor 192.0.2.254 description edge
 neighbor 192.0.2.254 timers 3 9
 !
 address-family ipv4 unicast
  network 192.0.2.128/26
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 route-map behind-origin out
 exit-address-family
!
