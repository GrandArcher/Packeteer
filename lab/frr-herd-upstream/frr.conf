! Simulated upstream for the herd lab (#260, #659). Documentation prefixes
! and documentation ASNs only. This router (AS 64501, 192.0.2.21) originates
! 192.0.2.128/26 behind origin AS 64510 and 192.0.2.192/27 behind origin AS
! 64511, and owns 192.0.2.130 on its loopback, so the members' ICMP probes
! of the first get real replies. 192.0.2.200 in the second is the dark
! host, which answers no ping. The edges of member-a, member-b, and
! member-c are 192.0.2.254 (AS 64496), 192.0.2.253 (AS 64497), and
! 192.0.2.252 (AS 64498).
frr version 10.2
frr defaults traditional
hostname upstream
log stdout informational
!
ip prefix-list dark seq 5 permit 192.0.2.192/27
!
route-map behind-origin permit 5
 match ip address prefix-list dark
 set as-path prepend 64511
!
route-map behind-origin permit 10
 set as-path prepend 64510
!
router bgp 64501
 bgp router-id 192.0.2.21
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Graceful restart stays off (FRR's default). Do not enable it.
 neighbor 192.0.2.254 remote-as 64496
 neighbor 192.0.2.254 description edge-a
 neighbor 192.0.2.254 timers 3 9
 neighbor 192.0.2.253 remote-as 64497
 neighbor 192.0.2.253 description edge-b
 neighbor 192.0.2.253 timers 3 9
 neighbor 192.0.2.252 remote-as 64498
 neighbor 192.0.2.252 description edge-c
 neighbor 192.0.2.252 timers 3 9
 !
 address-family ipv4 unicast
  network 192.0.2.128/26
  network 192.0.2.192/27
  neighbor 192.0.2.254 activate
  neighbor 192.0.2.254 route-map behind-origin out
  neighbor 192.0.2.253 activate
  neighbor 192.0.2.253 route-map behind-origin out
  neighbor 192.0.2.252 activate
  neighbor 192.0.2.252 route-map behind-origin out
 exit-address-family
!
