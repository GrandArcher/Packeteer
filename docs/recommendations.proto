// External policy feed stream (#232, docs/external-policy.md). Each
// message is the JSON document of GET /v1/recommendations as a Struct.
// Send "authorization: Bearer <token>" metadata over TLS.
syntax = "proto3";

package packeteer.policy.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

service Recommendations {
  rpc Watch(google.protobuf.Empty) returns (stream google.protobuf.Struct);
}
